# App Android: gera o .apk (Trusted Web Activity com Bubblewrap) a partir do site publicado e
# publica como Release, com link para baixar direto no celular. Rodar em Actions → App Android →
# Run workflow. Configuração (chave de assinatura e Secrets): docs/APP_ANDROID.md.
name: App Android (teste temporário)

on:
  push:
    branches: [claude/vibrant-heisenberg-wascev]
    paths: [android/**, .github/workflows/android-teste.yml]

permissions:
  contents: read

concurrency:
  group: android-teste
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chave descartável (só teste)
        run: |
          keytool -genkeypair -keystore android/android.keystore -storetype PKCS12 -alias soter -keyalg RSA -keysize 2048 \
            -validity 365 -storepass testeteste -keypass testeteste -dname "CN=Teste" 
      - name: Versão (número da execução)
        run: |
          cd android
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          jq --argjson code "$VERSION_CODE" --arg name "1.0.$VERSION_CODE" \
            '.appVersionCode = $code | .appVersionName = $name' twa-manifest.json > m.json && mv m.json twa-manifest.json
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.25.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          # o Bubblewrap procura o sdkmanager em <sdk>/tools/bin (formato antigo do SDK)
          [ -e "$ANDROID_HOME/tools" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Gerar o projeto e o .apk
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: testeteste
          BUBBLEWRAP_KEY_PASSWORD: testeteste
        run: |
          yes | bubblewrap update --skipVersionUpgrade
          yes | bubblewrap build --skipPwaValidation
          ls -la *.apk *.aab
      - uses: actions/upload-artifact@v4
        with:
          name: apk-teste
          path: android/app-release-signed.apk
          retention-days: 1
