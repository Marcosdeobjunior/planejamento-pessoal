# App Android: gera o .apk (Trusted Web Activity com Bubblewrap) a partir do site publicado e
# publica como Release, com link para baixar direto no celular. Rodar em Actions → App Android →
# Run workflow. Configuração (chave de assinatura e Secrets): docs/APP_ANDROID.md.
name: App Android

on:
  workflow_dispatch:

permissions:
  contents: write   # criar a Release com o .apk

concurrency:
  group: android
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chave de assinatura
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltam os Secrets ANDROID_KEYSTORE_B64 e ANDROID_KEYSTORE_PASSWORD (ver docs/APP_ANDROID.md)."
            exit 1
          fi
          # tolera espaços e quebras de linha que entram ao colar o Secret pelo celular
          B64=$(printf '%s' "$ANDROID_KEYSTORE_B64" | tr -d ' \r\n\t')
          PW=$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')
          echo "::add-mask::$PW"
          echo "KS_PASS=$PW" >> "$GITHUB_ENV"
          echo "Chave recebida: ${#B64} caracteres (a gerada tem 3528)."
          if ! printf '%s' "$B64" | base64 -d > android/android.keystore 2>/dev/null; then
            echo "::error::O Secret ANDROID_KEYSTORE_B64 não é um base64 válido (incompleto ou com caracteres a mais). Cole de novo o conteúdo inteiro do arquivo .b64."
            exit 1
          fi
          if ! keytool -list -keystore android/android.keystore -storepass "$PW" -alias soter > /dev/null 2>&1; then
            echo "::error::A chave abriu, mas a senha (ANDROID_KEYSTORE_PASSWORD) não confere ou o alias não é 'soter'."
            exit 1
          fi
          # impressão digital (pública): tem de ser a mesma do assetlinks.json
          keytool -list -v -keystore android/android.keystore -storepass "$PW" -alias soter | grep "SHA256:"
      - name: Versão (número da execução)
        run: |
          cd android
          VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))
          jq --argjson code "$VERSION_CODE" --arg name "1.0.$VERSION_CODE" \
            '.appVersionCode = $code | .appVersionName = $name' twa-manifest.json > m.json && mv m.json twa-manifest.json
          echo "VERSION_NAME=1.0.$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1.25.0
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          # o Bubblewrap procura o sdkmanager em <sdk>/tools/bin (formato antigo do SDK)
          [ -e "$ANDROID_HOME/tools" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Gerar o projeto e o .apk
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: |
          yes | bubblewrap update --skipVersionUpgrade
          # o log do Gradle é enorme: em caso de erro, mostra só o "What went wrong"
          if ! (yes | bubblewrap build --skipPwaValidation > build.log 2>&1); then
            grep -n -A25 "What went wrong" build.log || tail -80 build.log
            exit 1
          fi
          tail -5 build.log
          ls -la *.apk *.aab
      - name: Publicar a Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app-release-signed.apk "sol-de-soter-$VERSION_NAME.apk"
          gh release create "app-v$VERSION_NAME" "sol-de-soter-$VERSION_NAME.apk" \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "App Android $VERSION_NAME" \
            --notes "Baixe o arquivo .apk abaixo no celular Android e instale (permita instalar apps desta fonte). Atualizações instalam por cima mantendo os dados."
