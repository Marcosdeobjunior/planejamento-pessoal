    if(alvo){pmView='custom';openPageMenu($('#btnMore'),alvo)}
    return;}
  if(e.key==='Escape'&&S.peekId&&!menuEl){S.peekId=null;save();renderPeek();renderTree();return}
  if(menuEl&&['ArrowDown','ArrowUp','Enter','Escape','Tab'].indexOf(e.key)>=0)return menuKeys(e);

  const ct=e.target.closest&&e.target.closest('.ct');
  if(!ct)return;
  const host=hostOf(ct),p=pageOf(ct);
  const id=ct.dataset.b,i=p.blocks.findIndex(b=>b.id===id),b=p.blocks[i];
  if(!b)return;
  const caret=getCaret(ct),len=ct.innerText.length;

  if(mod&&e.key.toLowerCase()==='b'){e.preventDefault();return wrapSel(host,ct,b,'**')}
  if(mod&&e.key.toLowerCase()==='i'){e.preventDefault();return wrapSel(host,ct,b,'*')}

  if(e.key==='Enter'&&!e.shiftKey){
    e.preventDefault();
    if(b.t==='code'){document.execCommand('insertText',false,'\n');return}
    if(['bullet','num','todo','quote'].indexOf(b.t)>=0&&!b.text.trim()){
      b.t='p';rerenderBlock(host,b.id,0);save();return;
    }
    const rest=b.text.slice(caret);
    b.text=b.text.slice(0,caret);
    const cont=['bullet','num','todo'].indexOf(b.t)>=0?b.t:'p';
    const nb=mkBlock(cont,rest);
    p.blocks.splice(i+1,0,nb);
    refresh(host,'blocks');focusBlock(host,nb.id,0);save();return;
  }
  if(e.key==='Backspace'&&caret===0&&!window.getSelection().toString()){
    if(b.t!=='p'){e.preventDefault();b.t='p';b.checked=false;rerenderBlock(host,b.id,0);save();return}
    if(i>0){
      e.preventDefault();
      const prev=p.blocks[i-1];
      if(['divider','page','table','board','gallery'].indexOf(prev.t)>=0){
        p.blocks.splice(i-1,1);limpaColunas(p);refresh(host,'blocks');focusBlock(host,b.id,0);save();return;
      }
      const pos=prev.text.length;
      prev.text+=b.text;p.blocks.splice(i,1);
      limpaColunas(p);refresh(host,'blocks');focusBlock(host,prev.id,pos);save();return;
    }
  }
  if(e.key==='ArrowUp'&&caret===0&&i>0){e.preventDefault();focusBlock(host,p.blocks[i-1].id,-1)}
  if(e.key==='ArrowDown'&&caret===len&&i<p.blocks.length-1){e.preventDefault();focusBlock(host,p.blocks[i+1].id,0)}
});

function wrapSel(host,ct,b,mark){
  const s=window.getSelection();if(!s.rangeCount||!s.toString())return;
  const z=getCaret(ct),a=z-s.toString().length;
  b.text=b.text.slice(0,a)+mark+b.text.slice(a,z)+mark+b.text.slice(z);
  rerenderBlock(host,b.id,z+mark.length*2);save();
}
function addBlock(host,afterId,t,text,focus){
  const p=S.pages[host.dataset.pid];
  const i=p.blocks.findIndex(b=>b.id===afterId);
  const nb=mkBlock(t,text);
  p.blocks.splice(i+1,0,nb);refresh(host,'blocks');save();
  if(focus)focusBlock(host,nb.id,0);
  return nb;
}
/* um grupo com uma coluna só deixa de ser grupo */
function limpaColunas(p){
  const cont={};
  p.blocks.forEach(b=>{if(b.colg){(cont[b.colg]=cont[b.colg]||new Set()).add(b.coli||0)}});
  Object.keys(cont).forEach(g=>{
    if(cont[g].size<=1)p.blocks.forEach(b=>{if(b.colg===g){delete b.colg;delete b.coli}});
  });
}
function setType(host,id,t){
  const p=S.pages[host.dataset.pid],b=p.blocks.find(x=>x.id===id);if(!b)return;
  const mcol=t.match(/^col(\d)$/);
  if(mcol){
    const n=+mcol[1];
    const g=uid();
    b.t='p';b.text='';b.colg=g;b.coli=0;
    const i=p.blocks.indexOf(b);
    const novos=[];
    for(let k=1;k<n;k++){const nb=mkBlock('p','');nb.colg=g;nb.coli=k;novos.push(nb)}
    p.blocks.splice(i+1,0,...novos);
    p.cols=p.cols||{};
    p.cols[g]=new Array(n).fill(1/n);
    refresh(host,'blocks');save();focusBlock(host,b.id,0);return;
  }
  if(ehMidia(t)){
    b.t=t;b.text='';refresh(host,'blocks');save();
    setTimeout(()=>pedeMidia(host,b.id),30);return;
  }
  if(t==='grid'){
    b.t='grid';b.text='';b.grid={cols:3,linhas:[['','',''],['','','']]};
    refresh(host,'blocks');save();return;
  }
  if(t==='pagelink'){b.t='pagelink';b.text='';refresh(host,'blocks');save();
    setTimeout(()=>escolhePagina(host,b.id),30);return}
  if(t==='button'){b.t='button';b.text=b.text||'Nova página';refresh(host,'blocks');save();return}
  if(t==='toc'||t==='breadcrumb'){b.t=t;b.text='';refresh(host,'blocks');save();return}
  if(t==='page'){
    const sub=mkPage('Sem título',p.id,'📄');
    p.expanded=true;b.t='page';b.text=sub;refresh(host,'blocks');renderTree();save();return;
  }
  b.t=t;refresh(host,'blocks');save();
  if(!semTexto(t))focusBlock(host,id,0);
}

/* ============================================================
   Seletor de ícone e de capa
   fontes: emoji · cor sólida · degradê montado à mão · imagem
   (endereço da web ou arquivo do computador, redimensionado)
   ============================================================ */
const LIMITE_IMG=700000;   /* margem sob o teto de 1 MB do Firestore */

function reduzImagem(file,maxL,qual){
  return new Promise((ok,erro)=>{
    if(!/^image\//.test(file.type))return erro(new Error('o arquivo não é uma imagem'));
    const fr=new FileReader();
    fr.onerror=()=>erro(new Error('não consegui ler o arquivo'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>erro(new Error('imagem inválida'));
      im.onload=()=>{
        let w=im.width,h=im.height;
        const f=Math.min(1,maxL/Math.max(w,h));
        w=Math.max(1,Math.round(w*f));h=Math.max(1,Math.round(h*f));
        const cv=document.createElement('canvas');cv.width=w;cv.height=h;
        const cx=cv.getContext('2d');
        cx.fillStyle='#14121c';cx.fillRect(0,0,w,h);
        cx.drawImage(im,0,0,w,h);
        let q=qual||.82,url=cv.toDataURL('image/jpeg',q);
        while(url.length>LIMITE_IMG&&q>.35){q-=.12;url=cv.toDataURL('image/jpeg',q)}
        ok(url);
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
const cssUrl=u=>"url('"+cssQ(u)+"') center/cover no-repeat";
const ehUrl=u=>/^(https?:)?\/\//i.test(String(u).trim())||/^data:image\//i.test(String(u).trim());

function abrePicker(tipo,valorAtual,aplicar){
  const capa=tipo==='capa';
  let aba=capa?'degrade':'emoji';
  let c1='#7c6fcd',c2='#c8a96e',ang=135,solida='#c8a96e',endereco='';

  const ov=document.createElement('div');
  ov.className='overlay pickov';
  ov.innerHTML='<div class="picker"><div class="pkabas"></div><div class="pkcorpo"></div>'+
    '<div class="pkpe"><button class="pkrem">remover</button><button class="pkfechar">fechar</button></div></div>';
  document.body.appendChild(ov);
  const abas=ov.querySelector('.pkabas'),corpo=ov.querySelector('.pkcorpo');
  const fechar=()=>ov.remove();
  ov.onclick=e=>{if(e.target===ov)fechar()};
  ov.querySelector('.pkfechar').onclick=fechar;
  ov.querySelector('.pkrem').onclick=()=>{aplicar(null);fechar()};

  const lista=capa?[['degrade','Degradê'],['cor','Cor'],['imagem','Imagem']]
                  :[['emoji','Emoji'],['cor','Cor'],['imagem','Imagem']];
  const escolhe=v=>{aplicar(v);desenha()};

  function desenha(){
    abas.innerHTML=lista.map(a=>'<button data-aba="'+a[0]+'" class="'+(aba===a[0]?'on':'')+'">'+a[1]+'</button>').join('');
    abas.querySelectorAll('[data-aba]').forEach(b=>b.onclick=()=>{aba=b.dataset.aba;desenha()});

    if(aba==='emoji'){
      corpo.innerHTML='<div class="pkgrade">'+ICONS.map(e=>
        '<button data-emoji="'+e+'" class="'+(valorAtual===e?'on':'')+'">'+e+'</button>').join('')+'</div>'+
        '<label class="pklbl">ou cole qualquer emoji</label>'+
        '<div class="pklinha"><input class="pkin" id="pkEmoji" maxlength="8" placeholder="✦"><button class="pkok" id="pkEmojiOk">usar</button></div>';
      corpo.querySelectorAll('[data-emoji]').forEach(b=>b.onclick=()=>escolhe(b.dataset.emoji));
      corpo.querySelector('#pkEmojiOk').onclick=()=>{
        const v=corpo.querySelector('#pkEmoji').value.trim();
        if(v)escolhe(v);
      };
    }

    if(aba==='cor'){
      const paleta=['#c8a96e','#7c6fcd','#5ec4a8','#e06b8b','#e8864a','#4ab0e8','#e8e4f0','#3a3550'];
      corpo.innerHTML='<label class="pklbl">cores da casa</label>'+
        '<div class="pkgrade cores">'+paleta.map(c=>
          '<button data-cor="'+c+'" style="background:'+c+'"></button>').join('')+'</div>'+
        '<label class="pklbl">cor livre</label>'+
        '<div class="pklinha"><input type="color" id="pkCor" value="'+solida+'"><button class="pkok" id="pkCorOk">usar</button></div>';
      corpo.querySelectorAll('[data-cor]').forEach(b=>b.onclick=()=>
        escolhe(capa?b.dataset.cor:'col:'+b.dataset.cor));
      const inp=corpo.querySelector('#pkCor');
      inp.oninput=()=>{solida=inp.value};
      corpo.querySelector('#pkCorOk').onclick=()=>escolhe(capa?solida:'col:'+solida);
    }

    if(aba==='degrade'){
      const g=()=>'linear-gradient('+ang+'deg,'+c1+','+c2+')';
      corpo.innerHTML='<label class="pklbl">prontos</label>'+
        '<div class="pkgrade capas">'+COVERS.map((c,i)=>
          '<button data-capa="'+i+'" style="background:'+c+'"></button>').join('')+'</div>'+
        '<label class="pklbl">montar o seu</label>'+
        '<div class="pkprev" id="pkPrev" style="background:'+g()+'"></div>'+
        '<div class="pklinha">'+
          '<input type="color" id="pkC1" value="'+c1+'">'+
          '<input type="color" id="pkC2" value="'+c2+'">'+
          '<input type="range" id="pkAng" min="0" max="360" value="'+ang+'">'+
          '<button class="pkok" id="pkGrOk">usar</button></div>';
      corpo.querySelectorAll('[data-capa]').forEach(b=>b.onclick=()=>escolhe(COVERS[+b.dataset.capa]));
      const prev=corpo.querySelector('#pkPrev');
      const att=()=>{prev.style.background=g()};
      corpo.querySelector('#pkC1').oninput=e=>{c1=e.target.value;att()};
      corpo.querySelector('#pkC2').oninput=e=>{c2=e.target.value;att()};
      corpo.querySelector('#pkAng').oninput=e=>{ang=+e.target.value;att()};
      corpo.querySelector('#pkGrOk').onclick=()=>escolhe(g());
    }

    if(aba==='imagem'){
      corpo.innerHTML='<label class="pklbl">endereço na web</label>'+
        '<div class="pklinha"><input class="pkin" id="pkUrl" placeholder="https://…" value="'+esc(endereco)+'">'+
          '<button class="pkok" id="pkUrlOk">usar</button></div>'+
        '<label class="pklbl">arquivo do computador</label>'+
        '<button class="pkarq" id="pkArq">escolher imagem…</button>'+
        '<div class="pknota">imagens do computador são reduzidas antes de subir, para caber no limite de 1 MB por página</div>';
      const iu=corpo.querySelector('#pkUrl');
      iu.oninput=()=>{endereco=iu.value};
      corpo.querySelector('#pkUrlOk').onclick=()=>{
        const v=iu.value.trim();
        if(!ehUrl(v))return toast('endereço inválido — precisa começar com https://');
        escolhe(capa?cssUrl(v):'img:'+v);
      };
      corpo.querySelector('#pkArq').onclick=()=>{
        const f=document.createElement('input');
        f.type='file';f.accept='image/*';
        f.onchange=async()=>{
          const arq=f.files[0];if(!arq)return;
          toast('preparando a imagem…');
          try{
            const url=await reduzImagem(arq,capa?1600:256,capa?.82:.9);
            if(url.length>LIMITE_IMG)return toast('a imagem ficou grande demais mesmo reduzida');
            escolhe(capa?cssUrl(url):'img:'+url);
            toast('imagem aplicada');
          }catch(err){toast(err.message||'não consegui usar essa imagem')}
        };
        f.click();
      };
    }
  }
  desenha();
}

/* ---------------- blocos de mídia ---------------- */
function pedeMidia(host,bid){
  const p=S.pages[host.dataset.pid],b=p.blocks.find(x=>x.id===bid);if(!b)return;
  if(b.t==='image')
    return abrePicker('capa',null,v=>{
      if(!v)return;
      const m=String(v).match(/url\(['"]?([^'")]+)/);
      b.text=m?m[1]:'';                     /* só imagens: cor e degradê não servem */
      if(!b.text)return toast('escolha uma imagem, não uma cor');
      refresh(host,'blocks');save();
    });
  const nome={video:'endereço do vídeo (YouTube, Vimeo ou .mp4)',
    audio:'endereço do áudio (.mp3, .ogg)',file:'endereço do arquivo',
    bookmark:'endereço da página'}[b.t];
  const u=prompt(nome,b.text||'https://');
  if(u===null)return;
  b.text=u.trim();
  if(b.t==='bookmark'||b.t==='file'){
    const t2=prompt('rótulo (opcional):',b.leg||'');
    if(t2!==null)b.leg=t2.trim();
  }
  refresh(host,'blocks');save();
}
function escolhePagina(host,bid){
  const p=S.pages[host.dataset.pid],b=p.blocks.find(x=>x.id===bid);if(!b)return;
  const el=host.querySelector('.blk[data-id="'+bid+'"]');
  const r=(el||host).getBoundingClientRect();
  const cands=daArea().filter(x=>!x.trashed&&x.id!==p.id);
  if(!cands.length)return toast('não há outra página para apontar');
  openMenu(r.left+40,r.top+30,cands.slice(0,40).map(x=>({
    label:x.title||'Sem título',ic:ico(x.icon,'14px'),
    run:()=>{b.text=x.id;refresh(host,'blocks');save()}
  })),'Apontar para');
}

/* ---------------- menus ---------------- */
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}}
let menuItems=[],menuSel=0,menuTitle='',menuFresh=false;
function openMenu(x,y,items,title){
  closeMenu();
  menuItems=items;menuSel=0;menuTitle=title||'';
  /* o clique que abriu este menu ainda vai subir até o document,
     onde há um "fechar menus" — este sinal impede o auto-fechamento */
  menuFresh=true;setTimeout(()=>{menuFresh=false},0);
  menuEl=document.createElement('div');
  menuEl.className='menu';
  menuEl.style.left=Math.max(8,Math.min(x,window.innerWidth-272))+'px';
  menuEl.style.top=Math.max(66,Math.min(y,window.innerHeight-350))+'px';
  paintMenu();
  menuEl.addEventListener('mousedown',ev=>{
    const b=ev.target.closest('button[data-i]');if(!b)return;
    ev.preventDefault();const it=menuItems[+b.dataset.i];closeMenu();it.run();
  });
  document.body.appendChild(menuEl);
}
function paintMenu(){
  let ultimo=null,html=menuTitle?'<div class="grp">'+esc(menuTitle)+'</div>':'';
  menuItems.forEach((it,i)=>{
    if(it.grupo&&it.grupo!==ultimo){ultimo=it.grupo;html+='<div class="grp">'+esc(it.grupo)+'</div>'}
    html+=`<button data-i="${i}" class="${i===menuSel?'sel':''} ${it.act?'act':''}">
      ${it.ic?'<span class="ic">'+it.ic+'</span>':''}
      <span>${esc(it.label)}${it.sub?'<small>'+esc(it.sub)+'</small>':''}</span>
      ${it.kbd?'<span class="kbd">'+esc(it.kbd)+'</span>':''}</button>`;
  });
  menuEl.innerHTML=html;
  const sel=menuEl.querySelector('button.sel');
  if(sel&&sel.scrollIntoView)sel.scrollIntoView({block:'nearest'});
}
function menuKeys(e){
  if(e.key==='Escape'){e.preventDefault();popOff=popKey;return closeMenu()}
  if(e.key==='ArrowDown'){e.preventDefault();menuSel=(menuSel+1)%menuItems.length;paintMenu()}
  if(e.key==='ArrowUp'){e.preventDefault();menuSel=(menuSel-1+menuItems.length)%menuItems.length;paintMenu()}
  if(e.key==='Enter'||e.key==='Tab'){e.preventDefault();const it=menuItems[menuSel];closeMenu();it&&it.run()}
}

function pmDuplicate(p){

function descendantIds(id){

  (function walk(pid){Object.values(S.pages).forEach(c=>{if(c.parentId===pid&&!out.has(c.id)){out.add(c.id);walk(c.id)}})})(id);

function trashWithFallback(p){

function pmTrash(p){

function pmToggleCfg(p,key,onVal,offVal){

function pmOpenCustomize(p){pmView='custom';renderPMBody(p,'')}
function pmImport(p){
  const i=document.createElement('input');i.type='file';i.accept='.md,.txt';
  i.onchange=()=>{
    const f=i.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{
      const lines=String(rd.result).split(/\r?\n/);
      const blocks=[];
      lines.forEach(line=>{
        if(!line.trim())return;
        let m;
        if(m=line.match(/^### (.*)/))blocks.push(mkBlock('h3',m[1]));
        else if(m=line.match(/^## (.*)/))blocks.push(mkBlock('h2',m[1]));
        else if(m=line.match(/^# (.*)/))blocks.push(mkBlock('h1',m[1]));
        else if(m=line.match(/^[-*] (.*)/))blocks.push(mkBlock('bullet',m[1]));
        else if(m=line.match(/^\d+[.)] (.*)/))blocks.push(mkBlock('num',m[1]));
        else if(m=line.match(/^> (.*)/))blocks.push(mkBlock('quote',m[1]));
        else if(line.trim()==='---')blocks.push(mkBlock('divider'));
        else blocks.push(mkBlock('p',line));
      });
      if(!blocks.length){toast('nada para importar');return}
      if(p.blocks.length===1&&!p.blocks[0].text)p.blocks=blocks;
      else p.blocks=p.blocks.concat(blocks);
      p.updated=Date.now();save();
      const host=document.querySelector('.surface[data-pid="'+p.id+'"]');
      if(host)refresh(host,'blocks');else render();
      toast(blocks.length+' blocos importados');
    };
    rd.readAsText(f);
  };
  i.click();
}

let popKey=null,popOff=null;
function suggest(ct){
  const host=hostOf(ct),p=pageOf(ct);
  const b=p.blocks.find(x=>x.id===ct.dataset.b);if(!b)return closeMenu();
  const c=getCaret(ct),upto=b.text.slice(0,c);
  const link=upto.match(/\[\[([^\[\]\n]*)$/);
  /* aceita letras, números e espaços — “/titulo alternante 2” precisa passar */
  const cmd=upto.match(/(?:^|\s)\/([\p{L}\p{N} ]{0,26})$/u);
  const plus=upto.match(/(?:^|\s)\+([\p{L}\p{N}][\p{L}\p{N} ’'\-]{0,38})$/u);
  const gat=link?'[':cmd?'/':plus?'+':null;
  if(!gat){popKey=popOff=null;return closeMenu()}
  popKey=b.id+gat+(c-(link||cmd||plus)[1].length);
  if(popOff===popKey)return closeMenu();
  const sel=window.getSelection();
  let x=0,y=0;
  /* a posição do cursor é só para colocar o menu; se falhar, usa a do bloco */
  try{if(sel.rangeCount){const r=sel.getRangeAt(0).getBoundingClientRect();x=r.left;y=r.bottom+8}}catch(e){}
  if(!x){const r=ct.getBoundingClientRect();x=r.left;y=r.bottom+8}

  if(link){
    const q=slug(link[1]);
    const items=daArea().filter(pp=>pp.id!==p.id&&!pp.trashed&&slug(pp.title).indexOf(q)>=0).slice(0,6)
      .map(pp=>({label:pp.title||'Sem título',ic:ico(pp.icon,'15px'),sub:'ligar',run:()=>completeLink(host,ct,b,link[1],pp.title)}));
    if(link[1].trim())items.push({label:'Criar “'+link[1].trim()+'”',ic:icn('ico-plus'),sub:'nova página já ligada',
      run:()=>completeLink(host,ct,b,link[1],link[1].trim(),true)});
    if(!items.length)return closeMenu();
    return openMenu(x,y,items,'Ligar a uma página');
  }
  if(plus){
    const title=plus[1].trim();
    if(!title)return closeMenu();
    const ja=findPage(title);
    const items=ja&&ja.id!==p.id
      ? [{label:'Ligar a “'+ja.title+'”',ic:ico(ja.icon,'15px'),sub:'esta página já existe',
          run:()=>fromPlus(host,ct,b,plus[1],false)},
         {label:'Abrir “'+ja.title+'”',ic:icn('ico-maximize-2'),sub:'ligar e abrir',
          run:()=>fromPlus(host,ct,b,plus[1],true)}]
      : [{label:'Criar “'+title+'”',ic:icn('ico-plus'),sub:'página filha de '+(p.title||'Sem título'),
          run:()=>fromPlus(host,ct,b,plus[1],false)},
         {label:'Criar e abrir “'+title+'”',ic:icn('ico-maximize-2'),sub:'cria e já entra na página',
          run:()=>fromPlus(host,ct,b,plus[1],true)}];
    return openMenu(x,y,items,'Nova página aqui dentro');
  }
  if(cmd){
    const q=slug(cmd[1]);
    const items=BLOCK_TYPES.filter(t=>!q||slug(t[1]).indexOf(q)>=0||slug(t[5]||'').indexOf(q)>=0)
      .map(t=>({label:t[1],ic:t[2],sub:t[3],grupo:t[4],run:()=>{
        const cc=getCaret(ct);
        b.text=b.text.slice(0,cc-cmd[1].length-1)+b.text.slice(cc);
        setType(host,b.id,t[0]);
      }}));
    if(!items.length)return closeMenu();
    return openMenu(x,y,items,'');
  }
  closeMenu();
}
/* +texto → cria (ou liga) uma página filha da página onde se está escrevendo */
function fromPlus(host,ct,b,typed,abrir){
  const p=S.pages[host.dataset.pid];
  const title=typed.trim();
  if(!title)return;
  const c=getCaret(ct);
  const ini=c-typed.length-1;                    /* posição do próprio "+" */
  const soZinho=!b.text.slice(0,ini).trim()&&!b.text.slice(c).trim();
  const ja=findPage(title);
  const id=(ja&&ja.id!==p.id)?ja.id:mkPage(title,p.id,'📄');
  p.expanded=true;

  if(soZinho){
    b.t='page';b.text=id;
    refresh(host,'blocks');
    addBlock(host,b.id,'p','',true);             /* linha em branco para seguir escrevendo */
  }else{
    b.text=b.text.slice(0,ini)+'[['+title+']]'+b.text.slice(c);
    rerenderBlock(host,b.id,ini+title.length+4);
  }
  refresh(host,'back');renderTree();save();
  toast(ja?'ligada a “'+title+'”':'“'+title+'” criada dentro de '+(p.title||'Sem título'));
  if(abrir)openPage(id,true);
}
function completeLink(host,ct,b,typed,title,create){
  const p=S.pages[host.dataset.pid];
  const c=getCaret(ct);
  b.text=b.text.slice(0,c-typed.length-2)+'[['+title+']]'+b.text.slice(c);
  const pos=c-typed.length-2+title.length+4;
  if(create&&!findPage(title)){mkPage(title,p.id,'📄');p.expanded=true;renderTree()}
  rerenderBlock(host,b.id,pos);refresh(host,'back');save();
}

/* ---------------- navegação e exibição ---------------- */
function go(id){
  if(!S.pages[id])return;
  S.activeId=id;S.view='page';S.peekId=null;S.peekMode=null;
  let p=S.pages[id];while(p.parentId&&S.pages[p.parentId]){p=S.pages[p.parentId];p.expanded=true}
  document.body.classList.remove('show-side');
  try{history.replaceState(null,'',location.pathname+'#p='+id)}catch(e){}
  save();render();$('#scroll').scrollTop=0;
}
function openPage(id,fromLink){
  if(!S.pages[id])return;
  const m=effMode(S.pages[id]);
  if(!fromLink||m==='full')return go(id);
  S.peekId=id;S.peekMode=m;save();renderPeek();renderTree();
}
/* ---------------- cliques ---------------- */
document.addEventListener('mousedown',e=>{
  const wl=e.target.closest&&e.target.closest('.wl');
  if(wl){
    e.preventDefault();
    const t=findPage(wl.dataset.wl);
    if(t)openPage(t.id,true);
    else{const p=pageOf(wl);const id=mkPage(wl.dataset.wl,p?p.id:null,'📄');if(p)p.expanded=true;openPage(id,true)}
  }
});
document.addEventListener('click',e=>{
  const t=e.target;
  if(!t.closest('.menu')&&!menuFresh)closeMenu();
  if(pmenuEl&&!t.closest('.pmenu')&&!pmenuFresh)closePMenu();

  if(t.closest('[data-restore]')){const id=t.closest('[data-restore]').dataset.restore;restorePage(id);save();render();toast('página restaurada');return}
  if(t.closest('[data-purge]')){
    const id=t.closest('[data-purge]').dataset.purge,pg=S.pages[id];
    if(!pg)return;
    if(!confirm('Excluir definitivamente "'+(pg.title||'Sem título')+'"? Essa ação não pode ser desfeita.'))return;
    purgePage(id);save();render();toast('excluída definitivamente');return;
  }
  if(t.closest('[data-trashclear]')){
    const list=trashList();if(!list.length)return;
    if(!confirm('Excluir definitivamente todos os itens da lixeira?'))return;
    list.forEach(p=>purgePage(p.id));save();render();toast('lixeira esvaziada');return;
  }

  if(t.closest('[data-mapsel]')){S.mapaAtivo=t.closest('[data-mapsel]').dataset.mapsel;save();render();return}
  if(t.closest('[data-mapnovo]')){
    const nome=prompt('Nome do mapa:','Mapa sem título');
    if(nome===null)return;
    novoMapa(nome.trim());save();render();return;
  }
  if(t.closest('[data-maprename]')){
    const id=t.closest('[data-maprename]').dataset.maprename,mp=S.maps[id];if(!mp)return;
    const nome=prompt('Nome do mapa:',mp.nome);
    if(nome===null)return;
    mp.nome=nome.trim()||'Mapa sem título';save();render();return;
  }
  if(t.closest('[data-mapdel]')){
    const id=t.closest('[data-mapdel]').dataset.mapdel,mp=S.maps[id];if(!mp)return;
    if(!confirm('Excluir o mapa "'+(mp.nome||'Mapa sem título')+'"? Essa ação não pode ser desfeita.'))return;
    delete S.maps[id];
    if(S.mapaAtivo===id)S.mapaAtivo=null;
    save();render();return;
  }
  if(t.closest('[data-mapimg]')){
    const id=t.closest('[data-mapimg]').dataset.mapimg,mp=S.maps[id];if(!mp)return;
    abrePicker('capa',null,v=>{
      if(!v){mp.img=null;save();render();return}
      const mm=String(v).match(/url\(['"]?([^'")]+)/);
      if(!mm)return toast('escolha uma imagem, não uma cor');
      mp.img=mm[1];save();render();
    });
    return;
  }
  if(t.closest('[data-mapmkdel]')){
    const mkid=t.closest('[data-mapmkdel]').dataset.mapmkdel,mp=mapaAtual();if(!mp)return;
    mp.marcadores=(mp.marcadores||[]).filter(x=>x.id!==mkid);
    save();render();return;
  }
  if(t.closest('[data-mapmk]')){
    if(mapArrastou){mapArrastou=false;return}
    const mkid=t.closest('[data-mapmk]').dataset.mapmk,mp=mapaAtual();
    const mk=mp&&(mp.marcadores||[]).find(x=>x.id===mkid);
    if(mk&&S.pages[mk.pageId])openPage(mk.pageId,true);
    return;
  }
  const mapimgEl=t.closest('.mapimg');
  if(mapimgEl){
    const mp=mapaAtual();if(!mp)return;
    const r=mapimgEl.getBoundingClientRect();
    const x=((e.clientX-r.left)/r.width)*100,y=((e.clientY-r.top)/r.height)*100;
    const cands=daArea().filter(pg=>!pg.trashed);
    const itens=[{label:'criar nova página aqui',ic:icn('ico-plus'),run:()=>{
      const id=mkPage('Sem título',null,'📄');
      mp.marcadores=mp.marcadores||[];
      mp.marcadores.push({id:uid(),x:+x.toFixed(2),y:+y.toFixed(2),pageId:id});
      save();render();
    }}].concat(cands.slice(0,60).map(pg=>({label:pg.title||'Sem título',ic:ico(pg.icon,'14px'),
      run:()=>{mp.marcadores=mp.marcadores||[];
        mp.marcadores.push({id:uid(),x:+x.toFixed(2),y:+y.toFixed(2),pageId:pg.id});
        save();render()}})));
    openMenu(e.clientX,e.clientY,itens,'Marcar página aqui');
    return;
  }

  if(t.closest('[data-closepeek]')){S.peekId=null;save();renderPeek();renderTree();return}
  if(t.closest('[data-peekfull]')){const id=S.peekId;S.peekId=null;return go(id)}
  if(t.closest('[data-peekmore]')){
    const p=S.pages[S.peekId];
    if(p)openPageMenu(t.closest('[data-peekmore]'),p);
    return;
  }

  const holder=t.closest('[data-cfgpid]');
  if(holder){
    const pc=S.pages[holder.dataset.cfgpid];
    const cb=t.closest('[data-cfg]');
    if(cb){
      const v=cb.dataset.val;
      setCfg(pc,cb.dataset.cfg,v==='true'?true:(v==='false'?false:v));
      save();render();
      if(pmenuEl&&pmView==='custom')renderPMBody(pc,'');
      return;
    }

/* o bloco mostra markdown renderizado quando não está em foco; ao entrar nele,
   converte a posição visível para a posição no texto cru (senão o cursor pula) */
const MARCAS=['**','~~','[[',']]'];
function rawOffset(raw,vis){
  let i=0,v=0;
  while(i<raw.length&&v<vis){
    let pulou=false;
    for(let k=0;k<MARCAS.length;k++){
      if(raw.substr(i,2)===MARCAS[k]){i+=2;pulou=true;break}
    }
    if(pulou)continue;
    const c=raw[i];
    if(c==='*'||c==='`'||(c==='_'&&(i===0||/\s|\(/.test(raw[i-1])))){i++;continue}
    i++;v++;
  }
  return i;
}
document.addEventListener('focusin',e=>{
  const ct=e.target.closest&&e.target.closest('.ct');
  if(ct){
    const p=pageOf(ct),b=p&&p.blocks.find(x=>x.id===ct.dataset.b);
    if(b&&ct.textContent!==b.text){
      const vis=getCaret(ct);
      ct.textContent=b.text;
      setCaret(ct,Math.min(rawOffset(b.text,vis),b.text.length));
    }
  }
});

/* ---- redimensionar colunas ---- */
let redim=null;
document.addEventListener('mousedown',e=>{
  const sp=e.target.closest&&e.target.closest('[data-colsep]');
  if(!sp)return;
  e.preventDefault();
  const partes=sp.dataset.colsep.split(':'),g=partes[0],c=+partes[1];
  const host=hostOf(sp),p=S.pages[host.dataset.pid];
  const grupo=sp.closest('.cols');
  const n=grupo.querySelectorAll('.colitem').length;
  redim={g,c,p,grupo,x0:e.clientX,
    larg:(p.cols&&p.cols[g]?p.cols[g].slice():new Array(n).fill(1/n)),
    total:grupo.getBoundingClientRect().width||800};
  document.body.style.cursor='col-resize';
});
document.addEventListener('mousemove',e=>{
  if(!redim)return;
  const d=(e.clientX-redim.x0)/Math.max(1,redim.total);
  const min=.12;
  let na=redim.larg[redim.c]+d,nb=redim.larg[redim.c+1]-d;
  if(na<min){nb-=(min-na);na=min}
  if(nb<min){na-=(min-nb);nb=min}
  const w=redim.larg.slice();w[redim.c]=na;w[redim.c+1]=nb;
  const itens=redim.grupo.querySelectorAll('.colitem');
  w.forEach((x,i)=>{if(itens[i])itens[i].style.flex='0 1 '+(x*100).toFixed(3)+'%'});
  redim.novo=w;
});
document.addEventListener('mouseup',()=>{
  if(!redim)return;
  document.body.style.cursor='';
  if(redim.novo){redim.p.cols=redim.p.cols||{};redim.p.cols[redim.g]=redim.novo;save()}
  redim=null;
});

/* arrastar */
document.addEventListener('dragstart',e=>{
  const d=e.target.closest&&e.target.closest('[data-drag]');
  if(d){dragging={type:'block',id:d.dataset.drag,host:hostOf(d)};e.dataTransfer.effectAllowed='move';return}
  const c=e.target.closest&&e.target.closest('[data-card]');
  if(c)dragging={type:'card',id:c.dataset.card};
});
document.addEventListener('dragover',e=>{
  if(!dragging)return;
  e.preventDefault();
  if(dragging.type==='block'){
    document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    const b=e.target.closest('.blk');if(b)b.classList.add('drop-target');
  }else{
    document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));
    const d=e.target.closest('[data-drop]');if(d)d.classList.add('over');
  }
});
document.addEventListener('drop',e=>{
  if(!dragging)return;
  e.preventDefault();
  if(dragging.type==='block'){
    document.querySelectorAll('.drop-target').forEach(x=>x.classList.remove('drop-target'));
    const tgt=e.target.closest('.blk'),host=dragging.host;
    if(tgt&&hostOf(tgt)===host&&tgt.dataset.id!==dragging.id){
      const p=S.pages[host.dataset.pid];
      const alvo=p.blocks.find(b=>b.id===tgt.dataset.id);
      const from=p.blocks.findIndex(b=>b.id===dragging.id),to=p.blocks.findIndex(b=>b.id===tgt.dataset.id);
      const m=p.blocks.splice(from,1)[0];
      if(alvo&&alvo.colg){m.colg=alvo.colg;m.coli=alvo.coli||0}
      else{delete m.colg;delete m.coli}
      p.blocks.splice(to,0,m);limpaColunas(p);refresh(host,'blocks');save();
    }
  }else{
    document.querySelectorAll('.drop.over').forEach(x=>x.classList.remove('over'));
    const d=e.target.closest('[data-drop]');
    if(d){
      const s=S.pages[dragging.id];
      s.props[d.dataset.key]={type:'selecao',v:d.dataset.drop};
      if(s.propOrder.indexOf(d.dataset.key)<0)s.propOrder.unshift(d.dataset.key);
      save();render();
    }
  }
  dragging=null;
});
document.addEventListener('dragend',()=>{dragging=null});

      <label>hierarquia<input type="checkbox" id="gh" ${S.graphHier?'checked':''}></label>
      <label>distância<input type="range" id="gf" min="50" max="240" value="120"></label>
      <div class="leg">
        <span><i style="background:#c8a96e"></i>página ligada</span>
        <span><i style="background:#5ec4a8"></i>página atual</span>
        <span><i style="background:#858099"></i>sem ligação</span>
      </div>
    </div></div>`;

  const cv=$('#graph'),wrap=cv.parentElement;
  let ctx=null;try{ctx=cv.getContext('2d')}catch(e){}
  if(!ctx){sc.innerHTML='<div class="nada" style="padding:60px">este navegador não desenha o grafo</div>';return}
  const dpr=window.devicePixelRatio||1;
  const fit=()=>{cv.width=wrap.clientWidth*dpr;cv.height=wrap.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};
  fit();
  /* ouvintes registrados na janela precisam ser removidos ao trocar de vista,
     senão grafos antigos seguem reagindo com dados que já não existem */
  const aoSoltar=()=>{if(drag&&!drag.moved)openPage(drag.n.id,true);drag=null;pan=null};
  window.addEventListener('resize',fit);
  window.addEventListener('mouseup',aoSoltar);
  let vivo=true;
  limpaGrafo=()=>{
    vivo=false;
    window.removeEventListener('resize',fit);
    window.removeEventListener('mouseup',aoSoltar);
    if(anim){cancelAnimationFrame(anim);anim=null}
  };

  const RMIN=6,RMAX=18,RCAP=50;
  const list=daArea().filter(p=>!p.trashed);
  const N=list.map((p,i)=>({id:p.id,t:p.title||'Sem título',deg:0,
    r:RMIN,
    x:wrap.clientWidth/2+Math.cos(i*2.4)*(110+i*5),
    y:wrap.clientHeight/2+Math.sin(i*2.4)*(110+i*5),vx:0,vy:0}));
  const ix={};N.forEach((n,i)=>ix[n.id]=i);
  let E=[];
  const rebuild=()=>{
    E=[];N.forEach(n=>n.deg=0);
    list.forEach(p=>{
      if(S.graphLinks)outLinks(p).forEach(l=>{const t=findPage(l);
        if(t&&ix[t.id]!=null){E.push([ix[p.id],ix[t.id],1]);N[ix[p.id]].deg++;N[ix[t.id]].deg++}});
      if(S.graphHier&&p.parentId&&ix[p.parentId]!=null){
        E.push([ix[p.parentId],ix[p.id],0]);N[ix[p.id]].deg++;N[ix[p.parentId]].deg++}
    });
    N.forEach(n=>{n.r=RMIN+(RMAX-RMIN)*Math.min(1,n.deg/RCAP)});
  };
  rebuild();
  $('#gl').onchange=e=>{S.graphLinks=e.target.checked;save();rebuild()};
  $('#gh').onchange=e=>{S.graphHier=e.target.checked;save();rebuild()};
  let dist=120;$('#gf').oninput=e=>dist=+e.target.value;

  let cam={x:0,y:0,z:1},drag=null,pan=null,hover=null;
  const toW=e=>{const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left-cam.x)/cam.z,y:(e.clientY-b.top-cam.y)/cam.z}};
  const pick=p=>N.filter(n=>Math.hypot(n.x-p.x,n.y-p.y)<n.r+9)[0];
  cv.addEventListener('wheel',e=>{e.preventDefault();cam.z=Math.max(.3,Math.min(3,cam.z*(e.deltaY<0?1.12:.89)))},{passive:false});
  cv.addEventListener('mousedown',e=>{const p=toW(e),n=pick(p);
    if(n)drag={n,dx:n.x-p.x,dy:n.y-p.y,moved:false};else pan={x:e.clientX-cam.x,y:e.clientY-cam.y}});
  cv.addEventListener('mousemove',e=>{const p=toW(e);hover=pick(p);
    cv.style.cursor=hover?'pointer':(pan?'grabbing':'grab');
    if(drag){drag.n.x=p.x+drag.dx;drag.n.y=p.y+drag.dy;drag.n.vx=drag.n.vy=0;drag.moved=true}
    if(pan){cam.x=e.clientX-pan.x;cam.y=e.clientY-pan.y}});

  function step(){
    for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){
      const a=N[i],b=N[j],dx=b.x-a.x,dy=b.y-a.y;let d2=dx*dx+dy*dy||.01;
      if(d2>140000)continue;
      const d=Math.sqrt(d2),f=1600/d2;
      a.vx-=dx/d*f;a.vy-=dy/d*f;b.vx+=dx/d*f;b.vy+=dy/d*f;
    }
    E.forEach(ed=>{const a=N[ed[0]],b=N[ed[1]],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.01;
      const f=(d-dist)*.009;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
    const cx=wrap.clientWidth/2,cy=wrap.clientHeight/2;
    N.forEach(n=>{n.vx+=(cx-n.x)*.0018;n.vy+=(cy-n.y)*.0018;n.vx*=.85;n.vy*=.85;
      if(!drag||drag.n!==n){n.x+=n.vx;n.y+=n.vy}});
  }
  function draw(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ctx.save();ctx.translate(cam.x,cam.y);ctx.scale(cam.z,cam.z);
    E.forEach(ed=>{const a=N[ed[0]],b=N[ed[1]];
      ctx.strokeStyle=ed[2]?'rgba(200,169,110,.42)':'rgba(124,111,205,.3)';
      ctx.lineWidth=ed[2]?1:1.2;
      ctx.setLineDash(ed[2]?[]:[3,5]);
      ctx.globalAlpha=(hover&&hover!==a&&hover!==b)?.18:1;
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()});
    ctx.setLineDash([]);ctx.globalAlpha=1;
    N.forEach(n=>{
      const on=hover===n||n.id===S.activeId;
      const col=n.id===S.activeId?'#5ec4a8':(n.deg?'#c8a96e':'#858099');
      ctx.globalAlpha=hover&&!on?.4:1;
      if(on){ctx.shadowColor=col;ctx.shadowBlur=18}
      ctx.beginPath();ctx.arc(n.x,n.y,n.r,0,7);ctx.fillStyle=col;ctx.fill();
      ctx.shadowBlur=0;
      if(cam.z>.55||on){
        ctx.fillStyle=on?'#e8e4f0':'rgba(232,228,240,.62)';
        ctx.font=(on?'600 ':'')+'12px Syne,sans-serif';ctx.textAlign='center';
        ctx.fillText(n.t.length>24?n.t.slice(0,22)+'…':n.t,n.x,n.y+n.r+15);
      }
      ctx.globalAlpha=1});
    ctx.restore();
  }
  (function loop(){if(!vivo)return;step();draw();anim=requestAnimationFrame(loop)})();
}

function spotlight(pre){
  pre=pre||'';
  const ov=document.createElement('div');ov.className='overlay';
  ov.innerHTML='<div class="spot"><input id="sq" placeholder="buscar páginas, texto ou #marcações…" value="'+esc(pre)+'"><div class="res" id="sr"></div></div>';
  document.body.appendChild(ov);
  let items=[],sel=0;
  const cmds=[
    {label:'Nova página',ic:icn('ico-plus'),kind:'ação',run:()=>go(mkPage('',S.activeId,'📄'))},
    {label:'Abrir o grafo',ic:icn('ico-waypoints'),kind:'ação',run:()=>{S.view='graph';save();render()}},
    {label:'Exportar Markdown',ic:icn('ico-download'),kind:'ação',run:exportMD}
  ];
  const build=q=>{
    const s=slug(q);
    const pages=daArea().filter(p=>!p.trashed)
      .filter(p=>slug(p.title).indexOf(s)>=0||(s.length>2&&slug(pageText(p)).indexOf(s)>=0))
      .slice(0,8)
      .map(p=>({label:p.title||'Sem título',ic:ico(p.icon,'15px'),
        kind:p.parentId&&S.pages[p.parentId]?'em '+(S.pages[p.parentId].title||'…'):'raiz',run:()=>go(p.id)}));
    items=q?pages.concat(cmds.filter(c=>slug(c.label).indexOf(s)>=0))
      :cmds.concat(daArea().filter(p=>!p.trashed).slice(0,6).map(p=>({label:p.title||'Sem título',ic:ico(p.icon,'15px'),kind:'',run:()=>go(p.id)})));
    sel=0;paint();
  };
  const paint=()=>{$('#sr').innerHTML=items.map((it,i)=>
    '<button data-i="'+i+'" class="'+(i===sel?'sel':'')+'"><span>'+(it.ic||icn('ico-file-text'))+'</span>'+esc(it.label)+'<small>'+esc(it.kind||'')+'</small></button>').join('')
    ||'<div class="nada" style="padding:14px">enter cria uma página com esse nome</div>'};
  const close=()=>ov.remove();
  const inp=$('#sq');inp.focus();inp.select();
  inp.oninput=e=>build(e.target.value);
  inp.onkeydown=e=>{
    if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%Math.max(1,items.length);paint()}
    else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+items.length)%Math.max(1,items.length);paint()}
    else if(e.key==='Enter'){e.preventDefault();
      if(items[sel])items[sel].run();else if(e.target.value.trim())go(mkPage(e.target.value.trim(),null,'📄'));
      close()}
    else if(e.key==='Escape')close();
  };
  $('#sr').onclick=e=>{const b=e.target.closest('button[data-i]');if(b){items[+b.dataset.i].run();close()}};
  ov.onclick=e=>{if(e.target===ov)close()};
  build(pre);
}

/* ---------------- exportar ---------------- */
function toMD(p,depth){
  depth=depth||0;
  const props=p.propOrder.filter(k=>p.props[k]&&p.props[k].v).map(k=>k+': '+p.props[k].v).join('\n');
  let out='---\ntitulo: '+p.title+'\n'+props+'\n---\n\n'+'#'.repeat(Math.min(6,depth+1))+' '+p.title+'\n\n';
  let n=0;
  p.blocks.forEach(b=>{
    if(b.t==='num')n++;else n=0;
    const map={p:b.text,h1:'# '+b.text,h2:'## '+b.text,h3:'### '+b.text,
      bullet:'- '+b.text,num:n+'. '+b.text,todo:'- ['+(b.checked?'x':' ')+'] '+b.text,
      quote:'> '+b.text,code:'```\n'+b.text+'\n```',callout:'> '+(b.icon||'✦')+' '+b.text,
      h4:'#### '+b.text,
      toggle:'- '+b.text,th1:'# '+b.text,th2:'## '+b.text,th3:'### '+b.text,
      equation:'$$\n'+b.text+'\n$$',
      image:b.text?'!['+(b.leg||'')+']('+b.text+')':'',
      video:b.text?'[vídeo]('+b.text+')':'',audio:b.text?'[áudio]('+b.text+')':'',
      file:b.text?'['+(b.leg||'arquivo')+']('+b.text+')':'',
      bookmark:b.text?'['+(b.leg||b.text)+']('+b.text+')':'',
      grid:(b.grid?b.grid.linhas.map(l=>'| '+l.join(' | ')+' |').join('\n'):''),
      divider:'---',page:'',pagelink:'',toc:'',breadcrumb:'',button:'',
      table:'',board:'',gallery:'',list:''};
    const line=map[b.t]!==undefined?map[b.t]:b.text;
    if(line!=='')out+=line+'\n\n';
  });
  kids(p.id).forEach(c=>out+=toMD(c,depth+1));
  return out;
}
function download(name,text,mime){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));
  a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function exportMD(){
  const txt=daArea().filter(p=>!p.trashed&&(!p.parentId||orfa(p))).map(p=>toMD(p)).join('\n\n');
  download('rubrica.md',txt,'text/markdown');toast('markdown exportado');
}

/* backup restaurado: ids, tipos e chaves de página entram em atributos do HTML,
   então só aceitamos valores simples (letras, números, _ e -) */
function backupValido(d){
  if(!d||typeof d!=='object'||!d.pages||typeof d.pages!=='object'||Array.isArray(d.pages))return false;
  const CHAVES={id:1,parentId:1,ws:1,t:1,colg:1,coli:1,av:1,activeId:1,peekId:1,areaAtiva:1};
  let ok=true,n=0;
  const simples=x=>x==null||x===''||(typeof x==='number'&&isFinite(x))||(typeof x==='string'&&ID_OK.test(x));
  const anda=(v,fundo)=>{
    if(!ok)return;
    if(fundo>40||++n>500000){ok=false;return}
    if(Array.isArray(v)){v.forEach(x=>anda(x,fundo+1));return}
    if(v&&typeof v==='object')Object.keys(v).forEach(k=>{
      if(CHAVES[k]&&!simples(v[k]))ok=false;
      anda(v[k],fundo+1);
    });
  };
  Object.keys(d.pages).forEach(k=>{if(!ID_OK.test(k))ok=false});
  anda(d,0);
  return ok;
}
$('#btnBackup').onclick=e=>{
  const r=e.currentTarget.getBoundingClientRect();
  openMenu(r.left,r.top-100,[
    {label:'salvar backup (.json)',ic:icn('ico-download'),run:()=>{download('rubrica-backup.json',JSON.stringify(S,null,2),'application/json');toast('backup salvo')}},
    {label:'restaurar de um arquivo',ic:icn('ico-upload'),run:()=>{
      const i=document.createElement('input');i.type='file';i.accept='.json';
      i.onchange=()=>{const f=i.files[0];if(!f)return;const rd=new FileReader();
        rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!backupValido(d))throw 0;S=d;save();render();toast('restaurado')}
          catch(err){toast('arquivo inválido')}};rd.readAsText(f)};
      i.click()}}
  ],'Backup');
};
$('#btnMore').onclick=e=>{const p=P();if(p)openPageMenu(e.currentTarget,p)};
if(window.innerWidth<900)$('#togSide').style.display='block';

/* ---------------- início ---------------- */
(async function(){
  const d=await load();
  if(d)S=d;else{S={};seed()}
  if(!S.openMode)S.openMode='right';
  const hashId=(location.hash.match(/p=([a-z0-9]+)/i)||[])[1];
  if(hashId&&S.pages[hashId]&&!S.pages[hashId].trashed)S.activeId=hashId;
  else if(!S.activeId||!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0];
  if(S.view==='graph'||S.view==='trash')S.view='page';
  S.peekId=null;
  garanteAreas();
  applySideCollapsed();
  render();save();ajustaLateral();
  iniciado=true;
  const boot=document.getElementById('boot');
  if(boot){boot.style.transition='opacity .3s';boot.style.opacity='0';setTimeout(()=>boot.remove(),320)}
})();
</script>
