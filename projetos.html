<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdn.jsdelivr.net https://apis.google.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.google.com https://nominatim.openstreetmap.org https://api.open-meteo.com https://geocoding-api.open-meteo.com; frame-src https://*.firebaseapp.com https://www.google.com https://recaptcha.google.com https://www.youtube.com https://player.vimeo.com; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04040c">
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Projetos · Sól de Sóter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Syne:wght@400;600;700;800&family=Josefin+Sans:wght@400;600&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/design-system.css">
<link rel="stylesheet" href="css/icons.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/app-shell.css">
<style>
/* ===========================================================
   RUBRICA — mesa de escrita do Sól de Sóter
   tokens herdados de css/design-system.css
   =========================================================== */
:root{
  --bg:#0d0d12;
  --bg2:#13131c;
  --bg3:#1a1a27;
  --card:#16161f;
  --border:rgba(255,255,255,.07);
  --border-2:rgba(255,255,255,.12);
  --text:#e8e4f0;
  --muted:#858099;
  --accent1:#c8a96e;
  --accent2:#7c6fcd;
  --accent3:#5ec4a8;
  --accent4:#e06b8b;
  --accent5:#e8864a;
  --accent6:#4ab0e8;
  --font-display:"Playfair Display",Georgia,serif;
  --font-editorial:"Cormorant Garamond",Georgia,serif;
  --font-ui:"Syne",system-ui,sans-serif;
  --font-label:"Josefin Sans",system-ui,sans-serif;
  --font-mono:"DM Mono","Courier New",monospace;
  --radius:16px;
  --side-w:264px;
}
*{box-sizing:border-box}
html{height:100%;scrollbar-width:thin;scrollbar-color:rgba(200,169,110,.18) rgba(255,255,255,.02)}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:15px;
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:rgba(255,255,255,.02)}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(214,183,120,.6),rgba(200,169,110,.32));
  border-radius:999px;border:2px solid rgba(10,9,24,.88);
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;padding:0;cursor:pointer;color:inherit}
::selection{background:rgba(200,169,110,.28)}
:focus-visible{outline:1px solid var(--accent1);outline-offset:2px;border-radius:4px}
[contenteditable]{outline:none}

#app{position:relative;z-index:1;display:flex;height:calc(100vh - 58px);height:calc(100dvh - 58px);margin-top:58px}

/* ---------------- área de trabalho ---------------- */
/* a janela rola apenas o suficiente para revelar o rodapé; a lateral fica
   presa no lugar e encolhe para encostar no topo dele (ver ajustaLateral) */
.side{
  position:sticky;top:58px;align-self:flex-start;height:calc(100vh - 58px);height:calc(100dvh - 58px);
  width:var(--side-w);flex:0 0 var(--side-w);overflow:hidden;
  background:rgba(19,19,28,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-right:1px solid var(--border);display:flex;flex-direction:column;user-select:none;
  transition:width .2s ease,flex-basis .2s ease,opacity .15s ease,border-color .2s ease;
}
body.side-collapsed .side{width:0;min-width:0;flex:0 0 0;opacity:0;pointer-events:none;border-right-color:transparent}
.ws{
  display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;text-align:left;
  border-bottom:1px solid var(--border);transition:background .18s;
}
.ws:hover{background:rgba(255,255,255,.04)}
.wsico{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;background:rgba(200,169,110,.14);
  border:1px solid rgba(200,169,110,.3);display:grid;place-items:center;font-size:15px;color:var(--accent1);
}
.wsnm{flex:1;min-width:0}
.wsnm b{
  display:block;font-family:var(--font-display);font-size:15px;font-weight:700;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.wsnm small{
  display:block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.2px;
  text-transform:uppercase;color:var(--muted);margin-top:2px;
}
.wschev{color:var(--muted);font-size:11px}
/* menu de espaços */
.areamenu{min-width:262px;padding:6px 0}
.areamenu .cab{display:flex;gap:10px;align-items:center;padding:10px 14px 12px;border-bottom:1px solid var(--border)}
.areamenu .cab .wsico{width:34px;height:34px;flex:0 0 34px;font-size:16px}
.areamenu .conta{
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);padding:12px 14px 6px;
}
.areamenu .lin{
  display:flex;align-items:center;gap:10px;width:100%;padding:8px 14px;text-align:left;
  font-size:13.5px;color:var(--text-2,var(--muted));transition:background .16s;
}
.areamenu .lin:hover{background:rgba(255,255,255,.05);color:var(--text)}
.areamenu .lin .qi{
  width:24px;height:24px;flex:0 0 24px;border-radius:6px;border:1px solid var(--border);
  display:grid;place-items:center;font-size:12px;
}
.areamenu .lin .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.areamenu .lin .ck{color:var(--accent1);font-size:13px}
.areamenu .lin.nova{color:var(--accent1);font-size:13px}
.areamenu .sep{height:1px;background:var(--border);margin:6px 0}
.ws .mark{
  font-family:var(--font-display);font-size:19px;color:var(--accent1);letter-spacing:.5px;
}
.ws .mark em{font-style:italic}
.ws .sp{flex:1}
.sbtn{
  display:flex;align-items:center;gap:10px;width:100%;padding:7px 18px;
  font-family:var(--font-ui);font-size:12.5px;font-weight:600;letter-spacing:.3px;
  color:var(--muted);text-align:left;transition:color .18s;position:relative;
}
.sbtn:hover{color:var(--text)}
.sbtn .ic{width:16px;text-align:center;flex:0 0 16px;font-size:13px}
.sbtn .kbd{margin-left:auto;font-family:var(--font-mono);font-size:9.5px}
.sbtn.on{color:var(--accent1)}

.sec{
  display:flex;align-items:center;gap:8px;padding:20px 18px 8px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;color:var(--accent1);opacity:.8;
}
.sec .sp{flex:1}
.sec button{color:var(--muted);font-size:12px;padding:2px 5px;border-radius:5px;font-family:var(--font-mono)}
.sec button:hover{color:var(--accent1);background:rgba(200,169,110,.08)}

.tree{flex:1;overflow-y:auto;padding:0 8px 20px}
.row{
  display:flex;align-items:center;gap:4px;padding:4px 8px;border-radius:8px;cursor:pointer;
  color:var(--muted);font-size:13.5px;position:relative;transition:background .16s,color .16s;
}
.row:hover{background:rgba(255,255,255,.04);color:var(--text)}
.row.on{background:rgba(200,169,110,.1);color:var(--accent1)}
.row.on::before{content:'';position:absolute;left:-8px;top:6px;bottom:6px;width:2px;background:var(--accent1);border-radius:0 2px 2px 0}
.tw{
  width:16px;height:16px;flex:0 0 16px;display:grid;place-items:center;border-radius:4px;
  font-size:8px;color:var(--muted);transition:transform .16s,color .16s;
}
.tw:hover{color:var(--accent1);background:rgba(255,255,255,.06)}
.tw.open{transform:rotate(90deg);color:var(--accent1)}
.tw.leaf{opacity:.18}
.row .em{width:19px;flex:0 0 19px;text-align:center;font-size:14px}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cnt{font-family:var(--font-mono);font-size:9.5px;opacity:.45}
.row .add{opacity:0;font-size:14px;color:var(--muted);padding:0 4px;border-radius:5px;line-height:1}
.row .add:hover{background:rgba(255,255,255,.09)}
.row:hover .add{opacity:.8}
.row .add:hover{color:var(--accent1)}
.row .add[data-trashrow]{font-size:12px}
.row .add[data-trashrow]:hover{color:var(--accent4)}
.kids{display:none}
.kids.open{display:block}
.foot{padding:8px 0 16px;border-top:1px solid var(--border)}

/* ---------------- topo ---------------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.body{flex:1;display:flex;min-height:0;position:relative}
.top{
  height:58px;flex:0 0 58px;display:flex;align-items:center;gap:6px;padding:0 24px;
  background:rgba(6,5,16,.72);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  border-bottom:1px solid var(--border);
}
.crumb{display:flex;align-items:center;gap:2px;overflow:hidden}
.crumb button{
  padding:4px 9px;border-radius:6px;white-space:nowrap;font-size:12.5px;font-weight:600;
  color:var(--muted);letter-spacing:.3px;position:relative;transition:color .2s;
}
.crumb button::after{
  content:'';position:absolute;bottom:1px;left:9px;right:9px;height:1.5px;background:var(--accent1);
  transform:scaleX(0);transform-origin:left;transition:transform .25s cubic-bezier(.22,1,.36,1);border-radius:2px;
}
.crumb button:hover{color:var(--text)}
.crumb button:hover::after{transform:scaleX(1)}
.crumb button:last-child{color:var(--accent1)}
.crumb i{color:var(--muted);font-style:normal;opacity:.45;font-size:11px}
.top .sp{flex:1}
.tbtn{
  padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:1.4px;
  text-transform:uppercase;color:var(--muted);border:1px solid transparent;transition:all .25s;
  font-family:var(--font-ui);
}
.tbtn:hover{color:var(--accent1);border-color:rgba(200,169,110,.35);background:rgba(200,169,110,.07)}
.tbtn.icon{padding:6px 10px;font-size:13px;letter-spacing:0}

/* ---------------- superfície de página ---------------- */
.scroll{
  flex:1;overflow-y:auto;position:relative;background:var(--bg);
}
.surface{position:relative}
.cover{height:186px;position:relative;border-bottom:1px solid var(--border)}
.cover::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(13,13,18,.72))}
.cover .swap{
  position:absolute;right:20px;bottom:14px;z-index:2;background:rgba(6,5,16,.7);
  border:1px solid var(--border-2);padding:5px 12px;border-radius:999px;
  font-family:var(--font-mono);font-size:10px;letter-spacing:1px;color:var(--muted);opacity:0;transition:opacity .2s;
}
.cover:hover .swap{opacity:1}
.cover .swap:hover{color:var(--accent1);border-color:rgba(200,169,110,.4)}

.page{max-width:var(--page-w,760px);margin:0 auto;padding:0 56px 90px;position:relative}
.page.wide{max-width:90%;padding-left:76px;padding-right:76px}
.pico{
  font-size:56px;line-height:1;cursor:pointer;display:inline-grid;place-items:center;
  width:78px;height:78px;border-radius:20px;background:rgba(19,19,28,.86);
  border:1px solid var(--border-2);box-shadow:0 14px 40px rgba(0,0,0,.55);
  margin-bottom:10px;transition:transform .2s,border-color .2s;
}
.pico:hover{transform:translateY(-2px);border-color:rgba(200,169,110,.45)}
.has-cover .pico{margin-top:-46px;position:relative;z-index:3}
.ptitle{
  font-family:var(--font-display);font-size:44px;font-weight:700;line-height:1.12;
  letter-spacing:-.6px;color:#f0eaff;margin:0;padding:2px 0;
  text-shadow:0 0 60px rgba(124,111,205,.28);
}
.ptitle:empty::before{content:attr(data-ph);color:var(--muted);opacity:.5}
.ptools{display:flex;gap:6px;margin:12px 0 2px;opacity:0;transition:opacity .2s}
.surface:hover .ptools{opacity:1}
.ptools button{
  font-family:var(--font-mono);font-size:10px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);padding:4px 10px;border-radius:999px;border:1px solid var(--border);
}
.ptools button:hover{color:var(--accent1);border-color:rgba(200,169,110,.35)}

.props{margin:14px 0 6px;border-left:1px solid var(--border);padding-left:14px}
.prow{display:flex;align-items:flex-start;gap:8px;padding:2px 0;border-radius:8px}
.prow:hover{background:rgba(255,255,255,.025)}
.pkey{
  width:168px;flex:0 0 168px;display:flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--muted);padding:7px 8px;border-radius:6px;
}
.pkey:hover{color:var(--accent1)}
.pkey .ic{opacity:.55}
.pval{flex:1;min-width:0;padding:6px 10px;border-radius:6px;font-size:14px;cursor:text;color:var(--text)}
.pval:empty::before{content:'vazio';color:var(--muted);opacity:.45;font-family:var(--font-mono);font-size:11px}
.pval:hover{background:rgba(255,255,255,.04)}
.pill{
  display:inline-block;padding:3px 12px;border-radius:999px;font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
  border:1px solid currentColor;
}
.addprop{
  display:flex;align-items:center;gap:8px;color:var(--muted);opacity:.6;padding:7px 8px;border-radius:6px;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;
}
.addprop:hover{opacity:1;color:var(--accent1)}

/* ---------------- blocos ---------------- */
.blocks{padding-top:14px;padding-bottom:26vh}
.blk{position:relative;display:flex;align-items:flex-start;padding:var(--blk-gap,2px) 0}
.blk .gut{position:absolute;left:-48px;top:2px;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.blk:hover .gut{opacity:1}
.gut button{width:21px;height:24px;border-radius:6px;color:var(--muted);display:grid;place-items:center;font-size:13px}
.gut button:hover{background:rgba(255,255,255,.06);color:var(--accent1)}
.gut .drag{cursor:grab}
.marker{flex:0 0 auto;user-select:none;display:flex;align-items:flex-start;color:var(--accent1)}
.ct{
  flex:1;min-width:0;padding:3px 2px;white-space:pre-wrap;word-break:break-word;
  font-family:var(--ct-font,var(--font-editorial));font-size:var(--ct-size,20px);
  line-height:var(--ct-lh,1.68);color:var(--text);
}
.blk[data-t="p"] .ct{text-indent:var(--ct-indent,0)}
.surface.locked .gut,.surface.locked .addprop,.surface.locked .ptools{display:none}
.surface.locked .ct,.surface.locked .pval,.surface.locked [data-title]{cursor:default}
.lockbadge{
  display:inline-flex;align-items:center;gap:7px;margin-bottom:10px;padding:4px 12px;border-radius:999px;
  border:1px solid rgba(200,169,110,.3);background:rgba(200,169,110,.08);color:var(--accent1);
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
}
.ct:empty::before{content:attr(data-ph);color:var(--muted);opacity:.45;font-family:var(--font-mono);font-size:12px}

.blk[data-t="h1"] .ct,.blk[data-t="h2"] .ct,.blk[data-t="h3"] .ct{
  font-family:var(--font-display);font-weight:700;line-height:1.25;color:#f0eaff;
}
.blk[data-t="h1"] .ct{font-size:32px;padding-top:26px}
.blk[data-t="h2"] .ct{font-size:25px;padding-top:20px}
.blk[data-t="h3"] .ct{font-size:20px;padding-top:14px;font-weight:400;font-style:italic;color:var(--accent1)}
.blk[data-t="quote"]{border-left:2px solid var(--accent1);padding-left:18px;margin:8px 0}
.blk[data-t="quote"] .ct{font-style:italic;color:#d8d2e8}
.blk[data-t="code"]{background:rgba(255,255,255,.03);border:1px solid var(--border);border-radius:12px;padding:14px 18px;margin:8px 0}
.blk[data-t="code"] .ct{font-family:var(--font-mono);font-size:13px;line-height:1.7;color:var(--accent3)}
.blk[data-t="callout"]{
  background:rgba(124,111,205,.09);border:1px solid rgba(124,111,205,.24);
  border-radius:var(--radius);padding:16px 18px;margin:10px 0;gap:12px;
}
.blk[data-t="callout"] .ct{font-size:18px}
.blk[data-t="divider"]{padding:14px 0}
.blk[data-t="divider"] hr{width:100%;border:none;height:1px;margin:0;
  background:linear-gradient(90deg,transparent,rgba(200,169,110,.5),transparent)}
.blk[data-t="bullet"] .marker,.blk[data-t="num"] .marker,.blk[data-t="todo"] .marker{
  width:26px;justify-content:center;padding-top:6px;font-size:14px;
}
.blk[data-t="num"] .marker{font-family:var(--font-mono);font-size:12px}
.blk[data-t="todo"] .marker{cursor:pointer;font-size:15px}
.blk[data-t="todo"].done .ct{color:var(--muted);text-decoration:line-through}
.blk[data-t="page"] .pagelink{
  display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;flex:1;cursor:pointer;
  border:1px solid var(--border);background:rgba(255,255,255,.02);font-size:14px;font-weight:600;
  transition:border-color .2s,background .2s;
}
.blk[data-t="page"] .pagelink:hover{border-color:rgba(200,169,110,.4);background:rgba(200,169,110,.06)}
.blk.drop-target{box-shadow:0 2px 0 var(--accent1)}

.md-b{font-weight:600;color:#f2edff}
.md-i{font-style:italic}
.md-c{font-family:var(--font-mono);font-size:.72em;background:rgba(94,196,168,.12);color:var(--accent3);padding:2px 6px;border-radius:5px}
.md-s{text-decoration:line-through;opacity:.6}
.wl{color:var(--accent1);border-bottom:1px solid rgba(200,169,110,.35);cursor:pointer;padding:0 1px;transition:background .18s}
.wl:hover{background:rgba(200,169,110,.14)}
.wl.miss{color:var(--muted);border-bottom-style:dashed}
.tg{color:var(--accent2);cursor:pointer;font-family:var(--font-mono);font-size:.7em;letter-spacing:.5px}

/* ---------------- vistas ---------------- */
.dbwrap{width:100%;margin:10px 0}
.dbtabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:12px;padding-bottom:6px}
.dbtabs button{
  padding:5px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);
}
.dbtabs button:hover{color:var(--text)}
.dbtabs button.on{color:var(--accent1);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3)}
.dbtabs button{white-space:nowrap}
.dbtabs .vadd{padding:4px 9px;font-size:13px;line-height:1;opacity:.55;letter-spacing:0}
.dbtabs .vadd:hover{opacity:1;color:var(--accent1);background:rgba(200,169,110,.08)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{
  text-align:left;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.6px;text-transform:uppercase;
  color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:400;
}
td{padding:9px 10px;border-bottom:1px solid var(--border);color:var(--muted)}
tr:hover td{background:rgba(255,255,255,.02)}
td.nm{color:var(--text);cursor:pointer;font-size:14px}
td.nm:hover{color:var(--accent1)}
/* galeria */
.gal{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.gal.p{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:11px}
.gal.g{grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.gcard{
  border:1px solid var(--border);border-radius:14px;overflow:hidden;background:var(--card);
  cursor:pointer;display:flex;flex-direction:column;
  transition:border-color .22s,transform .22s,box-shadow .22s;
}
.gcard:hover{
  border-color:rgba(200,169,110,.42);transform:translateY(-3px);
  box-shadow:0 14px 34px rgba(0,0,0,.45);
}
.gcap{height:88px;position:relative;flex:0 0 88px}
.gal.p .gcap{height:62px;flex-basis:62px}
.gal.g .gcap{height:116px;flex-basis:116px}
.gcap::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(13,13,18,.5))}
.gico{
  position:absolute;left:12px;bottom:-15px;z-index:2;width:34px;height:34px;border-radius:10px;
  background:rgba(19,19,28,.94);border:1px solid var(--border-2);display:grid;place-items:center;font-size:17px;
}
.gbody{padding:22px 13px 13px;display:flex;flex-direction:column;gap:6px;flex:1}
.gcard b{
  font-family:var(--font-display);font-size:14.5px;font-weight:700;line-height:1.25;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.gal.g .gcard b{font-size:17px}
.gcard p{
  margin:0;font-family:var(--font-editorial);font-size:14px;line-height:1.5;color:var(--muted);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.gmeta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:auto;padding-top:8px}
.gmeta .pill{font-size:9px;padding:2px 8px}
.gw{font-family:var(--font-mono);font-size:9px;color:var(--muted);opacity:.55;letter-spacing:.5px}
.gcard.gnew{
  border-style:dashed;background:none;align-items:center;justify-content:center;gap:7px;
  min-height:150px;color:var(--muted);font-family:var(--font-mono);font-size:10px;
  letter-spacing:1.4px;text-transform:uppercase;
}
.gal.p .gcard.gnew{min-height:112px}
.gcard.gnew span{font-size:21px;line-height:1}
.gcard.gnew:hover{color:var(--accent1);border-color:rgba(200,169,110,.45);transform:none;box-shadow:none}
.gcard.dragging{opacity:.4}

/* mapa */
.maptabs{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--border);margin-bottom:14px;padding-bottom:6px;flex-wrap:wrap}
.maptabs button{
  padding:5px 12px;border-radius:999px;font-family:var(--font-mono);font-size:10px;
  letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.maptabs button:hover{color:var(--text)}
.maptabs button.on{color:var(--accent1);background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3)}
.maptabs .mapnew{padding:4px 9px;font-size:13px;line-height:1;opacity:.55;letter-spacing:0}
.maptabs .mapnew:hover{opacity:1;color:var(--accent1);background:rgba(200,169,110,.08)}
.mapbar{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.mapbar button{
  padding:6px 13px;border-radius:8px;border:1px solid var(--border);font-family:var(--font-mono);
  font-size:10px;letter-spacing:.8px;color:var(--muted);
}
.mapbar button:hover{color:var(--accent1);border-color:rgba(200,169,110,.4)}
.mapbar button.danger:hover{color:var(--accent4);border-color:rgba(224,107,139,.4)}
.mapdica{font-family:var(--font-mono);font-size:10px;color:var(--muted);opacity:.6;letter-spacing:.5px}
.mapstage{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);border:1px solid var(--border)}
.mapstage.vazio-stage{border-style:dashed;background:none}
.mapimg{display:block;width:100%;max-height:74vh;object-fit:contain;cursor:crosshair;user-select:none;background:#0a0912}
.mapin{
  position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;
  gap:2px;cursor:grab;
}
.mapin-ic{
  width:28px;height:28px;border-radius:50%;background:rgba(19,19,28,.94);border:1.5px solid var(--accent1);
  display:grid;place-items:center;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.5);
}
.mapin-lb{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:.4px;color:var(--text);
  background:rgba(10,9,20,.85);padding:2px 7px;border-radius:999px;white-space:nowrap;
  max-width:140px;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s;
}
.mapin:hover .mapin-lb{opacity:1}
.mapin-x{
  position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;
  background:var(--accent4);color:#fff;font-size:9px;display:none;place-items:center;line-height:1;
}
.mapin:hover .mapin-x{display:grid}

.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px}
.col{flex:0 0 236px}
.col h5{
  margin:0 0 10px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.8px;text-transform:uppercase;
  color:var(--muted);display:flex;gap:8px;font-weight:400;
}
.col .drop{min-height:64px;padding:3px;border-radius:12px;transition:background .18s}
.col .drop.over{background:rgba(200,169,110,.07);box-shadow:inset 0 0 0 1px rgba(200,169,110,.3)}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;
  margin-bottom:8px;cursor:pointer;transition:border-color .2s,transform .2s;
}
.card:hover{border-color:rgba(200,169,110,.35);transform:translateY(-1px)}
.card b{display:block;font-size:14px;font-weight:600;margin-bottom:5px}
.card small{font-family:var(--font-mono);font-size:10px;color:var(--muted)}

/* olho de visibilidade nas propriedades */
.prow{position:relative}
.polho{
  opacity:0;width:26px;height:26px;flex:0 0 26px;border-radius:6px;color:var(--muted);
  display:grid;place-items:center;font-size:12px;align-self:center;transition:opacity .15s,color .15s;
}
.prow:hover .polho{opacity:.65}
.polho:hover{opacity:1!important;color:var(--accent1);background:rgba(255,255,255,.05)}
.prow.esc .pkey,.prow.esc .pval{opacity:.45}
.prow.esc .polho{opacity:.65;color:var(--accent1)}
.propocultas{
  display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);opacity:.7;
}
.propocultas:hover{opacity:1;color:var(--accent1)}

/* ---- colunas ---- */
.cols{display:flex;align-items:flex-start;gap:0;width:100%;margin:6px 0}
.colitem{min-width:0;padding:0 2px}
.colitem .blk .gut{left:-20px}
.colitem .blk .gut button[data-plus]{display:none}
.colitem .blk[data-t="h1"] .ct,.colitem .blk[data-t="th1"] .ct{font-size:25px;padding-top:12px}
.colitem .blk[data-t="h2"] .ct,.colitem .blk[data-t="th2"] .ct{font-size:21px;padding-top:10px}
.colsep{
  flex:0 0 18px;align-self:stretch;cursor:col-resize;position:relative;
}
.colsep::after{
  content:'';position:absolute;top:4px;bottom:4px;left:50%;width:2px;margin-left:-1px;
  background:var(--border);border-radius:2px;transition:background .18s;
}
.colsep:hover::after{background:var(--accent1)}
.colvazia{
  border:1px dashed var(--border);border-radius:10px;padding:14px;text-align:center;
  color:var(--muted);opacity:.45;cursor:pointer;font-size:16px;
}
.colvazia:hover{opacity:1;color:var(--accent1);border-color:rgba(200,169,110,.4)}
@media (max-width:760px){
  .cols{flex-direction:column}
  .colitem{flex:1 1 auto!important;width:100%}
  .colsep{display:none}
}

/* ---- blocos de mídia, índice, trilha, grade ---- */
.mwrap{flex:1;min-width:0;padding:4px 0}
.mwrap.mresize{flex:0 0 auto;min-width:140px;max-width:100%;position:relative}
.mhandle{
  position:absolute;top:50%;right:-3px;width:7px;height:38px;margin-top:-19px;
  border-radius:4px;background:rgba(255,255,255,.14);cursor:ew-resize;opacity:0;transition:opacity .15s;
}
.mwrap.mresize:hover .mhandle{opacity:1}
.mhandle:hover{background:var(--accent1)}
.mdel{
  position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;
  background:rgba(10,9,20,.75);color:#fff;display:none;place-items:center;font-size:12px;
  border:1px solid rgba(255,255,255,.15);z-index:1;
}
.mwrap.mresize:hover .mdel{display:grid}
.mdel:hover{background:var(--accent4);border-color:var(--accent4)}
.vazio{
  border:1px dashed var(--border-2);border-radius:11px;padding:16px 18px;cursor:pointer;
  font-family:var(--font-mono);font-size:10.5px;letter-spacing:1.2px;color:var(--muted);
}
.vazio:hover{color:var(--accent1);border-color:rgba(200,169,110,.45);background:rgba(200,169,110,.05)}
.mfig{margin:0}
.mfig img{width:100%;border-radius:12px;display:block}
.mfig figcaption{
  font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;
  padding:8px 4px 0;letter-spacing:.6px;
}
.mfig figcaption:empty::before{content:attr(data-ph);opacity:.5}
.mframe{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000}
.mframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.mvid{width:100%;border-radius:12px;display:block;background:#000}
.maud{width:100%}
.mcard{
  display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);
  border-radius:12px;text-decoration:none;color:inherit;transition:border-color .2s;
}
.mcard:hover{border-color:rgba(200,169,110,.4)}
.mcard .mi{font-size:18px;opacity:.7}
.mcard .mt{min-width:0}
.mcard .mt b{display:block;font-size:14px;font-weight:600}
.mcard .mt small{display:block;font-family:var(--font-mono);font-size:10px;color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toc{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--border);padding-left:14px}
.toc a{
  font-family:var(--font-editorial);font-size:16px;color:var(--muted);cursor:pointer;padding:2px 0;
  text-decoration:none;border-bottom:1px solid transparent;
}
.toc a:hover{color:var(--accent1)}
.toc .toc2{padding-left:16px;font-size:15px}
.toc .toc3{padding-left:32px;font-size:14px}
.toc .toc4{padding-left:48px;font-size:13.5px}
.trilha{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-family:var(--font-mono);font-size:10.5px}
.trilha a{color:var(--muted);cursor:pointer;text-decoration:none}
.trilha a:hover{color:var(--accent1)}
.trilha i{opacity:.35;font-style:normal}
.gridblk{width:100%;border-collapse:collapse;font-size:14px}
.gridblk td{border:1px solid var(--border);padding:8px 10px;min-width:70px;vertical-align:top}
.gridblk td:focus{outline:none;background:rgba(200,169,110,.06)}
.gridbar{display:flex;gap:6px;margin-top:7px;opacity:0;transition:opacity .18s}
.blk:hover .gridbar{opacity:1}
.gridbar button{
  font-family:var(--font-mono);font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--muted);border:1px solid var(--border);border-radius:999px;padding:4px 10px;
}
.gridbar button:hover{color:var(--accent1);border-color:rgba(200,169,110,.4)}
.btnblk{
  padding:9px 18px;border:1px solid rgba(200,169,110,.4);border-radius:999px;color:var(--accent1);
  font-family:var(--font-ui);font-size:13px;font-weight:600;
}
.btnblk:hover{background:rgba(200,169,110,.12)}
.btnedit{
  display:inline-block;margin-left:10px;font-family:var(--font-mono);font-size:10px;color:var(--muted);
  opacity:0;transition:opacity .18s;min-width:60px;
}
.blk:hover .btnedit{opacity:.7}
.marker.dobra{cursor:pointer;transition:transform .16s;width:22px;height:22px;justify-content:center;align-items:center;margin-top:9px;font-size:14px}
/* títulos alternantes: seta alinhada à primeira linha do título (antes ficava acima dele) */
.blk[data-t="th1"] .marker.dobra{margin-top:38px;font-size:16px}
.blk[data-t="th2"] .marker.dobra{margin-top:28px;font-size:16px}
.blk[data-t="th3"] .marker.dobra{margin-top:18px}
.colitem .blk[data-t="th1"] .marker.dobra{margin-top:20px}
.colitem .blk[data-t="th2"] .marker.dobra{margin-top:15px}
.marker.dobra.aberta{transform:rotate(90deg)}
.blk[data-t="equation"] .ct{font-family:var(--font-mono);text-align:center;font-size:16px;color:var(--accent3)}
.blk[data-t="h4"] .ct{font-size:17px;padding-top:10px;font-family:var(--font-display);font-weight:700;color:#f0eaff}
.blk[data-t="th1"] .ct{font-size:32px;padding-top:26px}
.blk[data-t="th2"] .ct{font-size:25px;padding-top:20px}
.blk[data-t="th3"] .ct{font-size:20px;padding-top:14px}
.blk[data-t="th1"] .ct,.blk[data-t="th2"] .ct,.blk[data-t="th3"] .ct{
  font-family:var(--font-display);font-weight:700;line-height:1.25;color:#f0eaff}
.pagelink.vazio{border-style:dashed}
/* vista em lista */
.vlista{display:flex;flex-direction:column}
.vlin{
  display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:9px 6px;
  border-bottom:1px solid var(--border);color:var(--text);font-size:14.5px;
}
.vlin:hover{background:rgba(255,255,255,.03)}
.vlin .vt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vlin .vw{font-family:var(--font-mono);font-size:10px;color:var(--muted);opacity:.6}

/* ---------------- retrolinks ---------------- */
.backl{margin:0;padding:22px 0 0;border-top:1px solid var(--border)}

.backl h4{
  font-family:var(--font-mono);font-size:9.5px;letter-spacing:2.4px;text-transform:uppercase;
  color:var(--accent1);opacity:.8;margin:0 0 12px;font-weight:400;
}
.blitem{
  padding:11px 14px;border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.015);transition:border-color .2s;
}
.blitem:hover{border-color:rgba(200,169,110,.35)}
.blitem b{font-size:13.5px;font-weight:600;display:block;margin-bottom:3px}
.blitem span{font-family:var(--font-editorial);font-size:16px;color:var(--muted)}
.blitem mark{background:rgba(200,169,110,.18);color:var(--accent1);border-radius:3px;padding:0 3px}
.nada{font-family:var(--font-mono);font-size:11px;color:var(--muted);opacity:.6;margin-bottom:16px}

/* ---------------- exibição lateral / janela ---------------- */
#peekLayer{position:fixed;top:58px;left:0;right:0;bottom:0;z-index:60;pointer-events:none}
#peekLayer.on{pointer-events:auto}
.peek-bd{position:absolute;inset:0;background:rgba(5,4,12,.62);backdrop-filter:blur(3px);animation:fade .25s ease}
.peek{
  position:absolute;display:flex;flex-direction:column;background:rgba(13,13,18,.97);
  backdrop-filter:blur(24px);border:1px solid var(--border-2);box-shadow:0 30px 90px rgba(0,0,0,.7);
}
.peek.right{top:0;right:0;bottom:0;width:min(560px,94vw);border-radius:var(--radius) 0 0 var(--radius);
  border-right:none;animation:slideR .3s cubic-bezier(.16,1,.3,1)}
.peek.left{top:0;left:0;bottom:0;width:min(560px,94vw);border-radius:0 var(--radius) var(--radius) 0;
  border-left:none;animation:slideL .3s cubic-bezier(.16,1,.3,1)}
.peek.popup{
  top:50%;left:50%;transform:translate(-50%,-50%);width:min(980px,92vw);height:86vh;
  border-radius:var(--radius);animation:pop .3s cubic-bezier(.16,1,.3,1);
}
@keyframes slideR{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes slideL{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes pop{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.peek-top{
  display:flex;align-items:center;gap:10px;padding:0 16px;height:52px;flex:0 0 52px;
  border-bottom:1px solid var(--border);
}
.peek-top .t{
  flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--font-mono);
  font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);
}
.peek-scroll{flex:1;overflow-y:auto}
.peek .page{padding:0 34px 90px}
.peek .backl{padding:20px 0 0}
.peek .cover{height:130px}
.peek .ptitle{font-size:32px}
.peek .pico{width:62px;height:62px;font-size:42px}
.peek .has-cover .pico{margin-top:-36px}
.peek .pkey{width:130px;flex:0 0 130px}
.peek .blk .gut{left:-25px}
.peek .blk .gut button[data-plus]{display:none}
.peek-body{flex:1;display:flex;min-height:0;position:relative}
.peek-body .peek-scroll{flex:1}
/* tela "Personalizar" dentro do menu ⋯ */
.pmcust{padding:10px 12px 16px}
.pmback{
  display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;margin-bottom:6px;
  border-radius:8px;color:var(--accent1);font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:2px;text-transform:uppercase;
}
.pmback:hover{background:rgba(200,169,110,.1)}
.pmsec{
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:2px;text-transform:uppercase;
  color:var(--accent1);opacity:.75;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);
}
.pmcust .pmsec:first-of-type{margin-top:8px}
.pmcust .lbl{
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin:0 0 6px;
  font-family:var(--font-mono);font-size:9px;letter-spacing:1px;color:var(--muted);
}
.pmcust .lbl b{font-weight:400;color:var(--accent1);opacity:.9;text-transform:lowercase}
.pmmeta{
  font-family:var(--font-mono);font-size:9px;color:var(--muted);line-height:1.8;opacity:.6;
  margin-top:16px;padding-top:12px;border-top:1px solid var(--border);
}
.pmcust .reset{
  width:100%;margin-top:10px;padding:8px;border-radius:999px;border:1px solid var(--border);
  font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
}
.pmcust .reset:hover{color:var(--accent4);border-color:rgba(224,107,139,.4)}

/* ícone como imagem ou cor */
.icoimg{display:inline-block;background-size:cover;background-position:center;border-radius:5px;vertical-align:-.16em}
.icocol{display:inline-block;border-radius:5px;vertical-align:-.16em}
.pico .icoimg,.pico .icocol{border-radius:16px;width:100%!important;height:100%!important}

/* seletor de ícone e capa */
.picker{
  width:min(430px,94vw);background:rgba(10,9,20,.98);border:1px solid var(--border-2);
  border-radius:var(--radius);box-shadow:0 30px 80px rgba(0,0,0,.7);overflow:hidden;
}
.pkabas{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--border)}
.pkabas button{
  padding:8px 14px;border-radius:8px 8px 0 0;font-family:var(--font-mono);font-size:9.5px;
  letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);
}
.pkabas button:hover{color:var(--text)}
.pkabas button.on{color:var(--accent1);box-shadow:inset 0 -2px 0 var(--accent1)}
.pkcorpo{padding:14px 16px 6px;max-height:58vh;overflow-y:auto}
.pklbl{
  display:block;font-family:var(--font-mono);font-size:8.5px;letter-spacing:1.8px;
  text-transform:uppercase;color:var(--muted);margin:14px 0 7px;
}
.pklbl:first-child{margin-top:0}
.pkgrade{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pkgrade button{
  aspect-ratio:1;border:1px solid var(--border);border-radius:9px;font-size:19px;
  display:grid;place-items:center;transition:all .18s;
}
.pkgrade button:hover{border-color:rgba(200,169,110,.5);background:rgba(200,169,110,.08)}
.pkgrade button.on{border-color:var(--accent1);background:rgba(200,169,110,.14)}
.pkgrade.cores{grid-template-columns:repeat(8,1fr)}
.pkgrade.cores button,.pkgrade.capas button{border-color:var(--border-2)}
.pkgrade.capas{grid-template-columns:repeat(5,1fr)}
.pkgrade.capas button{aspect-ratio:16/10}
.pkprev{height:62px;border-radius:11px;border:1px solid var(--border-2);margin-bottom:9px}
.pklinha{display:flex;gap:7px;align-items:center}
.pkin{
  flex:1;min-width:0;background:rgba(255,255,255,.03);border:1px solid var(--border);
  border-radius:9px;padding:9px 11px;font-size:13px;color:var(--text);
}
.pkin:focus{outline:none;border-color:rgba(200,169,110,.5)}
.pklinha input[type=color]{
  width:42px;height:38px;flex:0 0 42px;padding:2px;border:1px solid var(--border);
  border-radius:9px;background:none;cursor:pointer;
}
.pklinha input[type=range]{flex:1;accent-color:var(--accent1)}
.pkok{

<script>
/* ============================================================
   página = {id, icon, title, parentId, blocks[], props{}, propOrder[],
             expanded, cover, created, updated}
   bloco  = {id, t, text, checked, icon}
   ============================================================ */
const KEY_BASE='rubrica:v3';
/* o espelho local é por usuário: sem isso, perfis diferentes no mesmo
   navegador leem e escrevem no mesmo balde e os dados vazam entre contas */
let KEY=KEY_BASE;
function chaveLocal(){
  try{
    const f=fb();
    if(f&&f.uid)return KEY_BASE+':'+f.uid;
  }catch(e){}
  return KEY_BASE+':anon';
}
function fixaChave(){KEY=chaveLocal();return KEY}
/* migração única: se existir o balde antigo compartilhado e o do usuário
   ainda não, adota-o só para esta conta e remove o compartilhado */
function migraChaveLocal(){
  try{
    const antigo=localStorage.getItem(KEY_BASE);
    if(!antigo)return;
    const f=fb();
    if(!f||!f.uid)return;             /* visitante: o balde antigo pode ser de uma conta; espera */
    let outra=false;
    for(let i=0;i<localStorage.length;i++){
      const k=String(localStorage.key(i)||'');
      if(k.indexOf('soter_state_cache_v2_')===0&&k!=='soter_state_cache_v2_guest'&&k!=='soter_state_cache_v2_'+f.uid)outra=true;
    }
    /* outra conta já usou este navegador: não dá para saber de quem é — descarta */
    if(!outra&&!localStorage.getItem(KEY))localStorage.setItem(KEY,antigo);
    localStorage.removeItem(KEY_BASE);
  }catch(e){}
}
/* ícone de interface (Lucide, css/icons.css), ex.: icn('ico-plus') */
const icn=c=>'<i class="ico '+c+'" aria-hidden="true"></i>';
/* tipo · nome · ícone · descrição · grupo · sinônimos para a busca */
const BLOCK_TYPES=[
  ['p','Texto','Aa','parágrafo corrido','Blocos básicos','paragrafo'],

  ['h3','Título 3','H3','subseção','Blocos básicos','###'],
  ['h4','Título 4','H4','subseção menor','Blocos básicos','####'],
  ['bullet','Lista com marcadores',icn('ico-list'),'lista simples','Blocos básicos','bullet'],
  ['num','Lista numerada',icn('ico-list-ordered'),'lista ordenada','Blocos básicos','ordenada'],
  ['todo','Lista de tarefas',icn('ico-list-todo'),'caixa de marcar','Blocos básicos','tarefa todo'],
  ['toggle','Lista de alternantes',icn('ico-list-collapse'),'dobra o que vem dentro','Blocos básicos','alternante toggle recolher'],
  ['page','Página',icn('ico-file-text'),'cria uma subpágina','Blocos básicos','subpagina'],
  ['callout','Frase de destaque',icn('ico-message-square-text'),'bloco em relevo','Blocos básicos','aviso destaque callout'],
  ['quote','Citação',icn('ico-quote'),'destaque com barra','Blocos básicos','citacao'],
  ['grid','Tabela',icn('ico-grid-3x3'),'tabela simples de texto','Blocos básicos','tabela grade'],
  ['divider','Divisor',icn('ico-minus'),'fio dourado','Blocos básicos','linha separador'],
  ['pagelink','Link para a página',icn('ico-arrow-up-right'),'aponta para uma página existente','Blocos básicos','link atalho'],
  ['col2','2 colunas',icn('ico-columns-2'),'lado a lado','Blocos básicos','coluna colunas duas'],
  ['col3','3 colunas',icn('ico-columns-3'),'três lado a lado','Blocos básicos','coluna colunas tres'],
  ['col4','4 colunas',icn('ico-columns-4'),'quatro lado a lado','Blocos básicos','coluna colunas quatro'],

  ['image','Imagem',icn('ico-image'),'da web ou do computador','Mídia','foto figura'],
  ['video','Vídeo',icn('ico-video'),'YouTube, Vimeo ou arquivo','Mídia','filme'],
  ['audio','Áudio',icn('ico-music'),'trilha ou gravação','Mídia','som musica'],
  ['code','Código',icn('ico-code'),'texto monoespaçado','Mídia','codigo'],
  ['file','Arquivo',icn('ico-paperclip'),'link para um arquivo','Mídia','anexo'],
  ['bookmark','Marcador da web',icn('ico-bookmark'),'cartão com o endereço','Mídia','bookmark link'],

  ['table','Visualização em tabela',icn('ico-table'),'subpáginas em tabela','Base de dados','tabela'],
  ['board','Visualização em quadro',icn('ico-kanban'),'subpáginas em colunas','Base de dados','quadro kanban'],
  ['gallery','Visualização em galeria',icn('ico-layout-grid'),'cartões com capa','Base de dados','galeria'],
  ['list','Visualização em lista',icn('ico-rows-3'),'uma linha por página','Base de dados','lista'],

  ['toc','Índice',icn('ico-table-of-contents'),'sumário dos títulos desta página','Blocos avançados','sumario indice toc'],
  ['equation','Equação em bloco',icn('ico-sigma'),'fórmula em destaque','Blocos avançados','equacao formula matematica'],
  ['button','Botão',icn('ico-rectangle-horizontal'),'cria uma subpágina ao clicar','Blocos avançados','botao'],
  ['breadcrumb','Trilha',icn('ico-chevrons-right'),'caminho até esta página','Blocos avançados','trilha caminho breadcrumb'],
  ['th1','Título alternante 1','›H1','título que dobra a seção','Blocos avançados','alternante dobra'],
  ['th2','Título alternante 2','›H2','título que dobra a seção','Blocos avançados','alternante dobra'],
  ['th3','Título alternante 3','›H3','título que dobra a seção','Blocos avançados','alternante dobra']
];
const GRUPOS=['Blocos básicos','Mídia','Base de dados','Blocos avançados'];
const ehTitulo=t=>['h1','h2','h3','h4','th1','th2','th3'].indexOf(t)>=0;
const nivelTitulo=t=>({h1:1,h2:2,h3:3,h4:4,th1:1,th2:2,th3:3})[t]||9;
const ehVista=t=>['table','board','gallery','list'].indexOf(t)>=0;
const ehMidia=t=>['image','video','audio','file','bookmark'].indexOf(t)>=0;
const semTexto=t=>['divider','page','toc','breadcrumb','button','grid'].indexOf(t)>=0||ehVista(t)||ehMidia(t);
const PROP_TYPES={texto:icn('ico-align-left'),selecao:icn('ico-circle-chevron-down'),numero:icn('ico-hash'),data:icn('ico-calendar')};
const PILL={ideia:'var(--muted)',rascunho:'var(--accent1)',revisar:'var(--accent5)',pronto:'var(--accent3)',
  protagonista:'var(--accent2)',antagonista:'var(--accent4)',secundario:'var(--accent6)'};
const ICONS=['✦','📖','✍️','🕯️','🗺️','🧭','👤','🌒','🏔️','🗝️','⚔️','🪶','🫀','🌫️','🔥','❄️','📄','🌬️'];
/* ícone minimalista da seção Mapa — traço fino, sem cor, escala com o font-size do contexto */
const MAPA_ICO='<svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" '+
  'stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-.14em">'+
  '<path d="M9 4.5 3.5 6.3v13.2L9 17.7l6 2.1 5.5-1.8V4.8L15 6.6l-6-2.1z"/><path d="M9 4.5v13.2M15 6.6v13.2"/></svg>';
const COVERS=[
  'linear-gradient(135deg,#1a1a27,#2a2140 55%,#3a2b4f)',
  'linear-gradient(135deg,#16161f,#2d2318 55%,#4a3a22)',
  'linear-gradient(135deg,#13131c,#152e2b 55%,#1d4740)',
  'linear-gradient(135deg,#1a1420,#3a1f2c 55%,#4f2436)',
  'linear-gradient(135deg,#0f1622,#152740 55%,#1c3a5c)'
];
/* configuração por página */
const CFG_DEF={modo:'herdar',largura:'normal',fonte:'editorial',tamanho:'normal',
  entrelinha:'normal',gap:'normal',recuo:'nenhum',travada:false};
const FONTE={editorial:'var(--font-editorial)',interface:'var(--font-ui)',maquina:'var(--font-mono)'};
const TAM={pequeno:'17px',normal:'20px',grande:'23px'};
const LH={compacto:'1.42',normal:'1.68',arejado:'1.98'};
const GAP={justo:'0px',normal:'2px',solto:'9px'};
const REC={nenhum:'0',medio:'1.6em',grande:'3em'};
const LARG={estreito:'620px',normal:'760px',largo:'980px',total:'90%'};
const MODO_NOME={full:'tela cheia',left:'lateral esq.',right:'lateral dir.',popup:'janela'};
function cfg(p,k){const c=p.cfg||{};return c[k]!==undefined?c[k]:CFG_DEF[k]}
function setCfg(p,k,v){p.cfg=p.cfg||{};p.cfg[k]=v;p.updated=Date.now()}
function styleOf(p){
  return '--ct-font:'+FONTE[cfg(p,'fonte')]+';--ct-size:'+TAM[cfg(p,'tamanho')]
    +';--ct-lh:'+LH[cfg(p,'entrelinha')]+';--blk-gap:'+GAP[cfg(p,'gap')]
    +';--ct-indent:'+REC[cfg(p,'recuo')]+';--page-w:'+LARG[cfg(p,'largura')];
}

function visible(id){
  let p=S.pages[id];
  if(!p)return false;
  while(p){if(p.trashed)return false;p=p.parentId?S.pages[p.parentId]:null}
  return true;
}
function trashPage(id){
  const now=Date.now();
  (function walk(pid){
    const pg=S.pages[pid];if(!pg||pg.trashed)return;
    pg.trashed=true;pg.trashedAt=now;
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>walk(c.id));
  })(id);
}
function restorePage(id){
  const target=S.pages[id];if(!target)return;
  (function down(pid){
    const pg=S.pages[pid];if(!pg||!pg.trashed)return;
    delete pg.trashed;delete pg.trashedAt;
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>down(c.id));
  })(id);
  let p=target;
  while(p&&p.parentId&&S.pages[p.parentId]){
    const anc=S.pages[p.parentId];
    if(anc.trashed){delete anc.trashed;delete anc.trashedAt}
    p=anc;
  }
}
function purgePage(id){
  (function rm(pid){
    Object.values(S.pages).filter(c=>c.parentId===pid).forEach(c=>rm(c.id));
    delete S.pages[pid];
  })(id);
  if(S.peekId&&!S.pages[S.peekId])S.peekId=null;
  if(!S.pages[S.activeId]){
    S.activeId=Object.keys(S.pages)[0]||null;
    if(!S.activeId)seed();
  }
}

/* ---------------- armazenamento ----------------
   Três camadas, da mais rápida para a mais durável:

   1. localStorage  — espelho local, base do desfazer, segura o texto offline
   2. Firestore     — users/{uid}/rubrica/{pageId}: UMA PÁGINA POR DOCUMENTO.
                      O limite de 1 MB passa a valer por página, não pelo
                      site inteiro, e cada gravação envia só o que mudou.
   3. SoterStorage  — só a migração do formato antigo (blob em data.rubrica)

   Se o Firestore recusar (regras, rede, sem login), tudo continua funcionando
   em local e o app avisa uma vez. */
const DKEY='rubrica';
const COL='rubrica';
const META='__meta';
const temShell=()=>!!(window.SoterStorage&&typeof window.SoterStorage.getState==='function');
const espera=ms=>new Promise(r=>setTimeout(r,ms));
let nuvemErro=false, nuvemOk=false, sincronizado=new Map();

const shellPrevisto=()=>!!document.querySelector('script[src*="app-shell"]');
async function esperaShell(limite){
  if(temShell())return true;
  if(!shellPrevisto())return false;
  const fim=Date.now()+(limite||2500);
  while(Date.now()<fim){if(temShell())return true;await espera(100)}
  return temShell();
}

/* instância do Firestore criada pelo app-shell (app nomeado) */
function fb(){
  try{
    if(!window.firebase||!window.firebase.app)return null;
    const cfg=window.SOTER_FIREBASE_CONFIG||{};
    const app=window.firebase.app(cfg.appName||'soter-app');
    const uid=app.auth().currentUser&&app.auth().currentUser.uid;
    if(!uid)return null;
    return {db:app.firestore(),uid:String(uid),
      raiz:app.firestore().collection(cfg.userCollection||'users').doc(String(uid)).collection(COL)};
  }catch(e){return null}
}
/* pergunta ao app-shell se há sessão, em vez de ficar tentando às cegas —
   sem login, o app abre local na hora */
async function esperaLogin(limite){
  const f0=fb();if(f0)return f0;
  if(!temShell()||typeof window.SoterStorage.getFirebaseAuthStatus!=='function')return null;
  let st=null;
  try{st=await Promise.race([window.SoterStorage.getFirebaseAuthStatus(),
    espera(limite||5000).then(()=>null)])}catch(e){return null}
  if(!st||!st.configured||!st.signedIn)return null;
  const fim=Date.now()+2000;
  while(Date.now()<fim){const f=fb();if(f)return f;await espera(100)}
  return fb();
}
/* true só quando há conta de verdade — usado para nunca deixar o
   tutorial de exemplo aparecer pra quem está logado, mesmo que a
   consulta ao Firestore falhe (regras, rede) em vez de vir vazia */
async function estaLogado(){
  if(!temShell()||typeof window.SoterStorage.getFirebaseAuthStatus!=='function')return false;
  try{const st=await window.SoterStorage.getFirebaseAuthStatus();return !!(st&&st.signedIn)}catch(e){return false}
}
function avisaNuvem(e){
  const msg=String((e&&e.code)||(e&&e.message)||e||'');
  if(nuvemErro)return;
  nuvemErro=true;
  toast(/permission|insufficient/i.test(msg)
    ? 'a nuvem recusou a gravação — verifique as regras do Firestore'
    : 'sem sincronizar com a nuvem agora — o texto está salvo neste aparelho');
  console.warn('[Rubrica] Firestore:',msg);
}

/* ---- leitura ---- */
/* apaga TODOS os documentos da Rubrica da conta logada (usado ao excluir a
   conta ou ao zerar os dados). Devolve quantos apagou. */
async function apagaNuvemRubrica(){
  const f=fb();if(!f)return 0;
  const snap=await f.raiz.get();
  if(snap.empty)return 0;
  let lote=f.db.batch(),n=0,total=0;
  const docs=[];snap.forEach(d=>docs.push(d.id));
  for(const id of docs){
    lote.delete(f.raiz.doc(id));n++;total++;
    if(n>=400){await lote.commit();lote=f.db.batch();n=0}
  }
  if(n)await lote.commit();
  sincronizado=new Map();
  return total;
}

/* o app-shell só apaga o siteState ao excluir a conta; ele não conhece a
   coleção rubrica/. Envolvemos a função dele para limpar o que é nosso
   ANTES de a conta ser removida — enquanto ainda há acesso. */
(function envolveExclusao(){
  function tenta(){
    if(!(window.SoterStorage&&typeof window.SoterStorage.deleteFirebaseAccount==='function'))return false;
    if(window.SoterStorage.__rubricaEnvolvido)return true;
    const original=window.SoterStorage.deleteFirebaseAccount.bind(window.SoterStorage);
    window.SoterStorage.deleteFirebaseAccount=async function(opts){
      try{await apagaNuvemRubrica()}catch(e){}          /* limpa a Rubrica primeiro */
      try{
        const f=fb();
        if(f&&f.uid)localStorage.removeItem(KEY_BASE+':'+f.uid);   /* e o espelho local */
      }catch(e){}
      return original(opts);                              /* depois exclui a conta */
    };
    window.SoterStorage.__rubricaEnvolvido=true;
    return true;
  }
  if(!tenta()){
    let t=0;const iv=setInterval(()=>{if(tenta()||++t>40)clearInterval(iv)},150);
  }
})();

async function nuvemCarregar(){
  const f=await esperaLogin(8000);
  if(!f)return null;
  try{
    const snap=await f.raiz.get();
    if(snap.empty)return {vazio:true};
    const pages={};let meta=null;
    snap.forEach(d=>{
      if(d.id===META)meta=d.data();
      else{const v=d.data();if(v&&v.p){pages[d.id]=v.p;sincronizado.set(d.id,JSON.stringify(v.p))}}
    });
    if(!Object.keys(pages).length)return {vazio:true};
    nuvemOk=true;
    return Object.assign({},meta&&meta.s?meta.s:{},{pages});
  }catch(e){avisaNuvem(e);return null}
}

/* ---- gravação incremental ---- */
let gravando=false,pendente=false;
async function nuvemGravar(){
  if(contaMudou())return;
  if(gravando){pendente=true;return}
  if(S&&S.semente)return;          /* só exemplo: não ocupa a conta */
  const f=fb();if(!f)return;
  gravando=true;
  try{
    /* JSON tira os campos undefined (o Firestore recusa o lote inteiro por causa de um só,
       por exemplo activeId numa conta ainda sem páginas) */
    const resto=JSON.parse(JSON.stringify(Object.assign({},S,{pages:undefined})));
    const lote=f.db.batch();let ops=0;
    const gravadas=[],apagadas=[];   /* só marcadas como sincronizadas depois do commit */
    for(const id in S.pages){
      const j=JSON.stringify(S.pages[id]);
      if(sincronizado.get(id)===j)continue;
      if(j.length>900000){toast('a página “'+(S.pages[id].title||'sem título')+'” está perto do limite de 1 MB');continue}
      if(ops>=400){pendente=true;break}   /* o resto vai no próximo lote */
      lote.set(f.raiz.doc(id),{p:JSON.parse(j),em:new Date().toISOString()});
      gravadas.push([id,j]);ops++;
    }
    for(const id of Array.from(sincronizado.keys())){
      if(S.pages[id])continue;
      if(ops>=450){pendente=true;break}
      lote.delete(f.raiz.doc(id));apagadas.push(id);ops++;
    }
    lote.set(f.raiz.doc(META),{s:resto,em:new Date().toISOString()});ops++;
    await lote.commit();
    gravadas.forEach(([id,j])=>sincronizado.set(id,j));
    apagadas.forEach(id=>sincronizado.delete(id));
    nuvemOk=true;nuvemErro=false;
  }catch(e){pendente=false;avisaNuvem(e)}   /* sem repetição imediata em erro: o próximo save tenta de novo */
  finally{
    gravando=false;
    if(pendente){pendente=false;setTimeout(nuvemGravar,400)}
  }
}

async function load(){
  await esperaShell(2500);
  fixaChave();migraChaveLocal();

  /* 1 · a nuvem é a fonte da verdade quando existe */
  const nuv=await nuvemCarregar();
  if(nuv&&!nuv.vazio)return nuv;

  /* 2 · migração do blob antigo dentro do estado do site */
  if(nuv&&nuv.vazio&&temShell()){
    try{
      const st=window.SoterStorage.getState();
      const d=st&&st.data?st.data[DKEY]:null;
      if(d&&d.pages&&Object.keys(d.pages).length){
        setTimeout(async()=>{
          await nuvemGravar();
          try{const s2=window.SoterStorage.getState();
            if(s2.data&&s2.data[DKEY]){delete s2.data[DKEY];window.SoterStorage.save(s2)}}catch(e){}
          toast('trabalho movido para a sua conta');
        },800);
        return d;
      }
    }catch(e){}
  }

  /* 3 · o que existir só neste navegador */
  try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);if(j&&j.pages)return j}}catch(e){}

  /* 4 · conta autenticada sem nada em lugar nenhum: conta nova de
     verdade — retorna em branco em vez de deixar o chamador semear o
     conteúdo de exemplo. Vale tanto quando a nuvem confirma vazio
     quanto quando a consulta falhou (regras, rede) — quem tem conta
     nunca deve ver o tutorial, só quem nunca logou. */
  if(nuv&&nuv.vazio)return estadoVazio();
  if(await estaLogado())return estadoVazio();

  return null;
}

function save(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    if(contaMudou())return;
    const serial=JSON.stringify(S);
    try{
      const prev=localStorage.getItem(KEY);
      if(prev&&prev!==serial){undoStack.push(prev);if(undoStack.length>40)undoStack.shift()}
      localStorage.setItem(KEY,serial);
    }
    catch(e){if(!memOnly){memOnly=true;toast('sem gravação permanente aqui — exporte um backup ao terminar')}}
    nuvemGravar();
  },500);
}

/* ao entrar na conta em outro aparelho, traz o que está na nuvem.
   Enquanto troca de conta, nada é gravado (contaMudou): o S em memória
   ainda é da conta anterior e não pode ir para o balde nem para a nuvem
   da conta nova. */
window.addEventListener('soter:firebase-auth-changed',async function(){
  trocandoConta=true;clearTimeout(saveT);undoStack=[];
  try{await trocaDeConta()}finally{trocandoConta=false}
});
async function trocaDeConta(){
  sincronizado=new Map();
  const chaveAntes=KEY;
  fixaChave();                       /* o usuário mudou: o balde local também muda */
  migraChaveLocal();
  let d=null;
  try{d=await nuvemCarregar()}catch(e){}
  if(!d||d.vazio||!d.pages||typeof d.pages!=='object'||!Object.keys(d.pages).length){
    /* nuvem vazia (ou consulta falhou) numa conta diferente da de antes,
       ou a tela ainda mostra o tutorial de exemplo para quem já tem
       conta: não deixa o texto da conta anterior (ou o exemplo) aparecer
       — abre o balde desta conta, ou vazio */
    if(KEY!==chaveAntes||(S&&S.semente&&await estaLogado())){
      let local=null;
      try{const r=localStorage.getItem(KEY);if(r){const j=JSON.parse(r);if(j&&j.pages)local=j}}catch(e){}
      if(local){S=local}
      else{S=estadoVazio();fixaChave()}
      garanteAreas();
      if(!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0]||null;
      S.peekId=null;if(S.view==='graph'||S.view==='trash')S.view='page';
      render();
    }
    return;
  }
  if(JSON.stringify(d.pages)===JSON.stringify(S.pages))return;
  /* mesma conta e alguém digitando: não atropela; conta diferente troca sempre */
  if(KEY===chaveAntes&&document.querySelector('.ct:focus,[data-title]:focus'))return;
  S=d;garanteAreas();
  if(!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0]||null;
  S.peekId=null;if(S.view==='graph'||S.view==='trash')S.view='page';
  render();toast('sincronizado com a sua conta');
}
function undo(){
  if(contaMudou())return;
  if(!undoStack.length){toast('nada para desfazer');return}
  const snap=undoStack.pop();
  let d=null;try{d=JSON.parse(snap)}catch(e){return}
  S=d;
  if(S.view==='graph')S.view='page';
  if(!S.pages[S.activeId])S.activeId=Object.keys(S.pages)[0]||null;
  render();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  nuvemGravar();
  toast('desfeito');
}

/* ícone da página: emoji puro, "img:<url>" ou "col:<css>" */
function ico(v,tam){
  v=v==null?'📄':String(v);
  const t=tam||'1em';
  if(v.indexOf('img:')===0)
    return '<span class="icoimg" style="width:'+t+';height:'+t+
      ';background-image:url(&quot;'+esc(cssQ(v.slice(4)))+'&quot;)"></span>';
  if(v.indexOf('col:')===0){
    const cor=v.slice(4);
    if(!/^[#\w\s,.%()+-]+$/.test(cor))return '📄';
    return '<span class="icocol" style="width:'+t+';height:'+t+';background:'+esc(cor)+'"></span>';
  }
  return esc(v);
}

/* ---------------- markdown ---------------- */
function inline(t){
  let h=esc(t);
  h=h.replace(/\[\[([^\[\]\n]+)\]\]/g,(m,n)=>{
    n=unesc(n);  /* h já está escapado; o título é comparado e escapado de novo como texto puro */
    const hit=findPage(n);
    return `<span class="wl${hit?'':' miss'}" data-wl="${esc(n)}">${esc(n)}</span>`;
  });
  h=h.replace(/\*\*([^*\n]+)\*\*/g,'<span class="md-b">$1</span>');
  h=h.replace(/(^|[\s(])_([^_\n]+)_/g,'$1<span class="md-i">$2</span>');
  h=h.replace(/(^|[\s(])\*([^*\n]+)\*/g,'$1<span class="md-i">$2</span>');
  h=h.replace(/~~([^~\n]+)~~/g,'<span class="md-s">$1</span>');
  h=h.replace(/`([^`\n]+)`/g,'<span class="md-c">$1</span>');
  h=h.replace(/(^|\s)#([\p{L}\p{N}_-]+)/gu,'$1<span class="tg" data-tag="$2">#$2</span>');
  return h;
}
function findPage(name){const s=slug(name);return daArea().filter(p=>!p.trashed&&slug(p.title)===s)[0]||null}
function outLinks(p){
  const o=[];
  (pageText(p).match(/\[\[([^\[\]\n]+)\]\]/g)||[]).forEach(m=>{const n=m.slice(2,-2).trim();if(n&&!o.includes(n))o.push(n)});
  return o;
}
function backlinks(p){return daArea().filter(q=>q.id!==p.id&&!q.trashed&&outLinks(q).some(l=>slug(l)===slug(p.title)))}

/* uma seção dobrada esconde os blocos até o próximo título de nível igual ou maior */
function ocultos(list){
  const esc2=new Set();
  for(let i=0;i<list.length;i++){
    const b=list[i];
    if(b.t.indexOf('th')===0&&b.dobrado){
      const n=nivelTitulo(b.t);
      for(let j=i+1;j<list.length;j++){
        const o=list[j];
        if(ehTitulo(o.t)&&nivelTitulo(o.t)<=n)break;
        esc2.add(o.id);
      }
    }
    if(b.t==='toggle'&&b.dobrado){
      for(let j=i+1;j<list.length;j++){
        const o=list[j];
        if(o.t==='toggle'||ehTitulo(o.t))break;
        esc2.add(o.id);
      }
    }
  }
  return esc2;
}

  if(b.t==='toggle'||b.t.indexOf('th')===0)
    marker=`<span class="marker dobra ${b.dobrado?'':'aberta'}" data-dobra="${b.id}">${icn('ico-chevron-right')}</span>`;
  if(b.t==='equation')marker='<span class="marker" style="opacity:.5">'+icn('ico-sigma')+'</span>';
  return `<div class="blk ${b.checked?'done':''}" data-t="${b.t}" data-id="${b.id}">

/* blocos vizinhos que compartilham colg formam um grupo de colunas;
   dentro dele, coli diz em qual coluna cada bloco fica */
function blocksHTML(p){
  const esconde=ocultos(p.blocks);
  const L=p.blocks;
  let out='',i=0;
  while(i<L.length){
    const b=L[i];
    if(esconde.has(b.id)){i++;continue}
    if(!b.colg){out+=blockHTML(p,b,i,L);i++;continue}
    const g=b.colg;let j=i;
    while(j<L.length&&L[j].colg===g)j++;
    const trecho=L.slice(i,j).filter(x=>!esconde.has(x.id));
    const nCols=Math.max(1,...trecho.map(x=>(x.coli||0)+1));
    const larg=(p.cols&&p.cols[g])||new Array(nCols).fill(1/nCols);
    let cols='';
    for(let c=0;c<nCols;c++){
      const w=((larg[c]||1/nCols)*100).toFixed(3);
      cols+=`<div class="colitem" data-colg="${g}" data-coli="${c}" style="flex:0 1 ${w}%">`+
        trecho.filter(x=>(x.coli||0)===c).map(x=>blockHTML(p,x,L.indexOf(x),L)).join('')+
        (trecho.some(x=>(x.coli||0)===c)?'':'<div class="colvazia" data-colnovo="'+g+':'+c+'"><i class="ico ico-plus" aria-hidden="true"></i></div>')+
        '</div>';
      if(c<nCols-1)cols+=`<div class="colsep" data-colsep="${g}:${c}" title="Arraste para redimensionar"></div>`;
    }
    out+=`<div class="cols" data-colgrp="${g}">${cols}</div>`;
    i=j;
  }
  return `<div class="blocks" data-blocks>${out}</div>`;
}

const GAL_FUNDO=[
  'linear-gradient(135deg,#1e1a2e,#332a4a)',
  'linear-gradient(135deg,#1c1a16,#3d3221)',
  'linear-gradient(135deg,#15201f,#1f3b36)',
  'linear-gradient(135deg,#231821,#472634)',
  'linear-gradient(135deg,#141c26,#1e3550)'
];
function galHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return h}
/* prévia do corpo da página, para o cartão da galeria */
function resumo(p,n){
  const t=p.blocks.filter(b=>['p','quote','callout','h2','h3'].indexOf(b.t)>=0)
    .map(b=>b.text).filter(x=>x&&x.trim()).join(' ')
    .replace(/\[\[([^\[\]]+)\]\]/g,'$1').replace(/[*`~_#]/g,'').trim();
  return t.length>n?t.slice(0,n).replace(/\s+\S*$/,'')+'…':t;
}
/* um bloco guarda várias vistas nomeadas; b.t espelha a ativa para que as
   checagens de bloco não textual continuem valendo */
const VNOME={table:'Tabela',board:'Quadro',gallery:'Galeria',list:'Lista'};
const VICO={table:icn('ico-table'),board:icn('ico-kanban'),gallery:icn('ico-layout-grid'),list:icn('ico-rows-3')};
function migraVistas(b){
  if(b.views&&b.views.length)return b;
  const tipo=['table','board','gallery','list'].indexOf(b.t)>=0?b.t:'board';
  b.views=[{id:uid(),nome:VNOME[tipo],tipo,gs:b.gs||'m'}];
  b.av=0;delete b.gs;
  return b;
}
/* chaves de propriedade que existem entre as subpáginas */
function chavesDe(subs){
  const vistas=[];
  subs.forEach(x=>x.propOrder.forEach(k=>{if(vistas.indexOf(k)<0)vistas.push(k)}));
  return vistas;
}
/* quais aparecem nesta vista (sem escolha = todas) */
function propsDaVista(v,subs){
  const todas=chavesDe(subs);
  if(!v.props)return todas;
  return todas.filter(k=>v.props.indexOf(k)>=0);
}
function ordenaSubs(v,subs){
  const o=v.ord;
  if(!o||!o.campo)return subs;
  const val=x=>{
    if(o.campo==='__nome')return slug(x.title||'');
    if(o.campo==='__palavras')return pageWords(x);
    if(o.campo==='__data')return x.updated||0;
    return slug((x.props[o.campo]||{}).v||'');
  };
  return subs.slice().sort((a,b)=>{
    const A=val(a),B=val(b);
    const r=typeof A==='number'?A-B:String(A).localeCompare(String(B),'pt-BR');
    return (o.dir==='desc'?-1:1)*r;
  });
}
function filtraSubs(v,subs){
  if(!v.filtro||!v.filtro.campo||!v.filtro.valor)return subs;
  return subs.filter(x=>slug((x.props[v.filtro.campo]||{}).v||'')===slug(v.filtro.valor));
}
function vAtiva(b){migraVistas(b);b.av=Math.min(b.av||0,b.views.length-1);return b.views[b.av]}

function dbHTML(p,b){
  const va=vAtiva(b);
  const mode=va.tipo;
  const todos=kids(p.id);
  const subs=ordenaSubs(va,filtraSubs(va,todos));
  const keys=propsDaVista(va,todos).slice(0,6);
  const tabs=`<div class="dbtabs">
    ${b.views.map((x,i)=>`<button class="vtab ${i===b.av?'on':''}" data-vsel="${i}" data-id="${b.id}"
      title="${i===b.av?'Opções desta vista':'Ver '+esc(x.nome)}">${VICO[x.tipo]} ${esc(x.nome)}</button>`).join('')}
    <button class="vadd" data-vadd="${b.id}" title="Adicionar uma vista"><i class="ico ico-plus" aria-hidden="true"></i></button>
    <span style="flex:1"></span>
    ${mode==='gallery'?`<button data-galsize="${b.id}" title="Tamanho dos cartões">${{p:icn('ico-grid-3x3'),m:icn('ico-grid-2x2'),g:icn('ico-rectangle-horizontal')}[va.gs||'m']}</button>`:''}
    <button data-vcfg="${b.id}" title="Configurações da database"><i class="ico ico-ellipsis" aria-hidden="true"></i></button>
    <button data-dbnew="${b.id}">+ nova página</button></div>`;
  if(!subs.length)return tabs+`<div class="nada">nenhuma subpágina ainda — clique em “+ nova página”</div>`;

  if(mode==='gallery'){
    const gs=va.gs||'m';
    return tabs+`<div class="gal ${gs}">${subs.map(s=>{
      const capa=s.cover||GAL_FUNDO[Math.abs(galHash(s.id))%GAL_FUNDO.length];
      const props=keys.filter(k=>(s.props[k]||{}).v).slice(0,gs==='p'?1:3);
      const txt=resumo(s,gs==='p'?0:gs==='m'?90:190);
      return `<article class="gcard" data-card="${s.id}" data-page="${s.id}" draggable="true">
        <div class="gcap" style="background:${capa}"><span class="gico">${ico(s.icon,'18px')}</span></div>
        <div class="gbody">
          <b>${esc(s.title||'Sem título')}</b>
          ${txt?`<p>${esc(txt)}</p>`:''}
          <div class="gmeta">
            ${props.map(k=>{const val=s.props[k].v,c=PILL[slug(val)];
              return `<span class="pill" style="color:${c||'var(--muted)'}">${esc(val)}</span>`}).join('')}
            <span class="gw">${pageWords(s)}p</span>
            ${kids(s.id).length?`<span class="gw">${icn('ico-file-text')} ${kids(s.id).length}</span>`:''}
          </div>
        </div>
      </article>`;
    }).join('')}
      <button class="gcard gnew" data-dbnew="${b.id}"><span><i class="ico ico-plus" aria-hidden="true"></i></span>nova página</button>
    </div>`;
  }

  if(mode==='list'){
    return tabs+`<div class="vlista">${subs.map(x=>`
      <button class="vlin" data-page="${x.id}">
        <span class="vi">${ico(x.icon,'15px')}</span>
        <span class="vt">${esc(x.title||'Sem título')}</span>
        <span class="vp">${keys.map(k=>{const vv=(x.props[k]||{}).v;

  return tabs+`<div class="board">${vals.map(v=>{
    const items=subs.filter(s=>slug((s.props[key]||{}).v||'')===slug(v));
    return `<div class="col"><h5>${esc(v)}<span style="opacity:.5">${items.length}</span></h5>

      </div></div>`;
  }).join('')}</div>`;
}

function rerenderBlock(host,id,caret){
  const p=S.pages[host.dataset.pid];

  if(b)ct.textContent=b.text;

/* ---------------- cursor ---------------- */
function getCaret(el){
  const s=window.getSelection();if(!s.rangeCount)return 0;
  const r=s.getRangeAt(0),pre=document.createRange();
  pre.selectNodeContents(el);
  try{pre.setEnd(r.endContainer,r.endOffset)}catch(e){return 0}
  return pre.toString().length;
}
function setCaret(el,pos){
  const r=document.createRange(),s=window.getSelection();
  let n=0,done=false;
  (function walk(node){
    if(done)return;
    if(node.nodeType===3){
      if(n+node.length>=pos){r.setStart(node,Math.max(0,pos-n));done=true}else n+=node.length;
    }else[].slice.call(node.childNodes).forEach(walk);
  })(el);
  if(!done){r.selectNodeContents(el);r.collapse(false)}else r.collapse(true);
  s.removeAllRanges();s.addRange(r);
}

  if(ct){
    const host=hostOf(ct),p=pageOf(ct);
    const b=p.blocks.find(x=>x.id===ct.dataset.b);if(!b)return;
    b.text=ct.innerText.replace(/\u00a0/g,' ');

    const inEdit=e.target.closest&&e.target.closest('[contenteditable]');
    if(!inEdit){e.preventDefault();undo();return}
  }
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();return spotlight()}
  if(mod&&e.key.toLowerCase()==='g'){e.preventDefault();S.view=S.view==='graph'?'page':'graph';save();return render()}
  if(mod&&e.key==='\\'){e.preventDefault();return toggleSideCollapse()}
  if(mod&&(e.key===';'||e.key===':')){e.preventDefault();
